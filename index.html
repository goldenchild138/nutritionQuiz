<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Revision Quizzes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600;700;800&display=swap">
<style>
[hidden] { display: none !important }
body { margin: 0 }
/* Layout: topic select, title + test switcher, then one question card; answers 2x2, stacking on phones */
:root {
  --bg: #f3f5ee; --surface: #ffffff; --fg: #1d2418; --muted: #5d6656;
  --accent: #c98a00; --accent-ink: #1d2418; --accent-soft: #fbf0d4; --line: #d9dfd0;
  --good: #2f7d3b; --good-bg: #e2f2e2; --bad: #b3362b; --bad-bg: #f8e1de;
  --s1: #2a78d6; --s2: #eb6834; --grid-major: #c3ccb8; --grid-minor: #e4e9dc;
  --cell: #e3f0d2; --chl: #3d8b36; --sap: #d9e9f7; --wax: #f3e2a0; --soil: #c8a27a; --film: #b9d6f2; --dough: #d9b17c; --fat: #fff4cf;
  --display: "Barlow", system-ui, -apple-system, sans-serif;
  --body: "Barlow", system-ui, -apple-system, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #151a12; --surface: #1f261b; --fg: #edf0e6; --muted: #a3ad98;
  --accent: #f0b52a; --accent-ink: #151a12; --accent-soft: #3a3016; --line: #34402e;
  --good: #7fd18b; --good-bg: #1f3a22; --bad: #f08a7e; --bad-bg: #3d1f1b;
  --s1: #3987e5; --s2: #d95926; --grid-major: #4a5743; --grid-minor: #2b3427;
  --cell: #2a3b22; --chl: #72c468; --sap: #1d3348; --wax: #5c4e1b; --soil: #7a5b3c; --film: #24496b; --dough: #8a6a3e; --fat: #4a4227; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #151a12; --surface: #1f261b; --fg: #edf0e6; --muted: #a3ad98;
  --accent: #f0b52a; --accent-ink: #151a12; --accent-soft: #3a3016; --line: #34402e;
  --good: #7fd18b; --good-bg: #1f3a22; --bad: #f08a7e; --bad-bg: #3d1f1b;
  --s1: #3987e5; --s2: #d95926; --grid-major: #4a5743; --grid-minor: #2b3427;
  --cell: #2a3b22; --chl: #72c468; --sap: #1d3348; --wax: #5c4e1b; --soil: #7a5b3c; --film: #24496b; --dough: #8a6a3e; --fat: #4a4227; color-scheme: dark }

* { box-sizing: border-box }
body { background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 17px; line-height: 1.5 }
.wrap { max-width: 720px; margin: 0 auto; padding-inline: 16px; padding-block: 32px 48px; display: grid; gap: 20px }
h1, h2 { font-family: var(--display); text-wrap: balance; margin: 0 }
.eyebrow { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 700 }
.subjects { display: flex; gap: 4px; border-bottom: 2px solid var(--line); overflow-x: auto }
.subj { font: inherit; font-family: var(--display); font-weight: 800; font-size: 18px; padding: 10px 18px; border: 0; background: none; color: var(--muted); cursor: pointer; border-bottom: 4px solid transparent; margin-bottom: -2px; white-space: nowrap }
.subj:hover { color: var(--fg) }
.subj[aria-current="page"] { color: var(--fg); border-bottom-color: var(--accent) }
.subj:focus-visible { outline: 3px solid var(--accent); outline-offset: -3px }
.topicbar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px }
.topicbar label { margin: 0 }
.hs-cta { margin-left: auto; font: inherit; display: inline-flex; align-items: center; gap: 10px; padding: 8px 16px 8px 12px; border-radius: 12px; border: 2px solid var(--fg); background: var(--accent); color: var(--accent-ink); cursor: pointer; box-shadow: 3px 3px 0 var(--fg); text-align: left }
.hs-cta:hover { transform: translate(-1px, -1px); box-shadow: 4px 4px 0 var(--fg) }
.hs-cta:focus-visible, .linkbtn:focus-visible, .hs-tab:focus-visible, .name-input:focus-visible { outline: 3px solid var(--fg); outline-offset: 2px }
.hs-cta span { display: grid; line-height: 1.2 }
.hs-cta small { font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums }
.player { margin: 0; color: var(--muted) }
.sound { font: inherit; font-size: 14px; font-weight: 700; padding: 8px 12px; border-radius: 999px; border: 2px solid var(--line); background: var(--surface); color: var(--fg); cursor: pointer }
.sound[aria-pressed="false"] { color: var(--muted); text-decoration: line-through }
.sound:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px }
.linkbtn { font: inherit; font-weight: 700; background: none; border: 0; padding: 0; color: var(--fg); cursor: pointer; text-decoration: underline; text-decoration-color: var(--accent); text-decoration-thickness: 2px; text-underline-offset: 3px }
.name-input { font: inherit; font-size: 18px; padding: 12px 14px; border-radius: 10px; border: 2px solid var(--line); background: var(--bg); color: var(--fg); flex: 1 1 220px; min-width: 0 }
.err { margin: 0; color: var(--bad); font-weight: 700 }
.board-mini { display: grid; gap: 10px; padding: 16px; border-radius: 12px; background: var(--bg); border: 1px solid var(--line) }
.rankline { margin: 0; font-weight: 700 }
.savenote { margin: 0; font-size: 14px; color: var(--muted) }
.table-wrap { overflow-x: auto }
.board { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums }
.board th { text-align: left; font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); padding: 6px 8px; border-bottom: 2px solid var(--line); white-space: nowrap }
.board td { padding: 8px; border-bottom: 1px solid var(--line); white-space: nowrap }
.board td.name { white-space: normal; font-weight: 700; min-width: 8ch }
.board td.big { font-family: var(--display); font-weight: 800; font-size: 18px }
.board tr.me td { background: var(--accent-soft) }
.board .medal { display: inline-grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; font-weight: 800; font-size: 13px; background: var(--line); color: var(--fg) }
.board tr:nth-child(1) .medal { background: #e8b923; color: #1d2418 } .board tr:nth-child(2) .medal { background: #c4cbd3; color: #1d2418 } .board tr:nth-child(3) .medal { background: #cd8a4b; color: #1d2418 }
.board .empty { color: var(--muted); padding: 16px 8px; white-space: normal }
.overlay { position: fixed; inset: 0; background: rgb(0 0 0 / .45); display: grid; place-items: start center; padding: max(24px, env(safe-area-inset-top, 0px)) 16px 24px; overflow-y: auto; z-index: 10 }
.sheet { width: 100%; max-width: 720px; background: var(--surface); color: var(--fg); border-radius: 16px; border: 2px solid var(--fg); padding: 20px; display: grid; gap: 14px; box-shadow: 6px 6px 0 var(--fg) }
.hs-tabs { display: flex; flex-wrap: wrap; gap: 6px }
.hs-tab { font: inherit; font-weight: 700; font-size: 14px; padding: 6px 14px; border-radius: 999px; border: 2px solid var(--line); background: transparent; color: var(--fg); cursor: pointer }
.hs-tab[aria-selected="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg) }
.select { font: inherit; font-weight: 700; font-size: 16px; padding: 10px 40px 10px 14px; border-radius: 10px; border: 2px solid var(--line); background-color: var(--surface); color: var(--fg); cursor: pointer; appearance: none; -webkit-appearance: none;
  background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%);
  background-position: calc(100% - 20px) 55%, calc(100% - 15px) 55%; background-size: 5px 5px; background-repeat: no-repeat; max-width: 100% }
.select:hover { border-color: var(--accent) }
.select:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px }
.head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: end; gap: 16px }
.versions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap }
.versions .eyebrow { margin-right: 4px }
.v { font-family: var(--display); font-weight: 800; font-size: 18px; width: 44px; height: 44px; border-radius: 10px; border: 2px solid var(--line); background: var(--surface); color: var(--fg); cursor: pointer }
.v:hover { border-color: var(--accent) }
.v[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink) }
.v:focus-visible, .opt:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 24px; display: grid; gap: 20px }
.progress { display: flex; gap: 3px }
.progress span { height: 6px; flex: 1; border-radius: 3px; background: var(--line) }
.progress span.ok { background: var(--good) } .progress span.no { background: var(--bad) } .progress span.now { background: var(--accent) }
.meta { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap }
.meta b { font-variant-numeric: tabular-nums }
.q { font-size: clamp(22px, 4vw, 30px); line-height: 1.2; font-weight: 800 }
.opts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px }
@media (max-width: 520px) { .opts { grid-template-columns: 1fr } }
.opt { font: inherit; text-align: left; padding: 14px 16px; border-radius: 10px; border: 2px solid var(--line); background: var(--bg); color: var(--fg); cursor: pointer; display: flex; gap: 12px; align-items: baseline; min-width: 0 }
.opt:hover:not(:disabled) { border-color: var(--accent) }
.opt:disabled { cursor: default }
.opt kbd { font-family: var(--display); font-weight: 800; color: var(--muted); font-size: 14px }
.opt.correct { border-color: var(--good); background: var(--good-bg) }
.opt.wrong { border-color: var(--bad); background: var(--bad-bg) }
.opt .tick { margin-left: auto; font-style: normal; font-weight: 800; font-size: 22px; line-height: 1; align-self: center }
.opt.correct .tick { color: var(--good) }
.buddy { width: 48px; height: 48px; flex: none; image-rendering: pixelated; animation: hop .5s ease-out, bob .52s ease-in-out .5s infinite alternate }
.opt .buddy { margin-block: -10px; margin-left: auto; align-self: center }
@keyframes bob { from { transform: translateY(0) } to { transform: translateY(-3px) } }
.opt .buddy + .tick { margin-left: 0 }
@keyframes hop { 0% { transform: translateY(8px) scale(.4); opacity: 0 } 60% { transform: translateY(-6px) scale(1.1); opacity: 1 } 100% { transform: none } }
@media (prefers-reduced-motion: reduce) { .buddy { animation: none } }
.remember { font: inherit; font-weight: 700; justify-self: start; background: none; border: 0; padding: 4px 0; color: var(--fg); cursor: pointer; display: inline-flex; gap: 8px; align-items: center; text-decoration: underline; text-decoration-color: var(--accent); text-decoration-thickness: 2px; text-underline-offset: 4px }
.remember::before { content: "▸"; color: var(--accent); transition: transform .2s; text-decoration: none }
.remember[aria-expanded="true"]::before { transform: rotate(90deg) }
.remember:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px }
.memory { border: 2px dashed var(--accent); background: var(--accent-soft); border-radius: 14px; padding: 20px; display: grid; gap: 14px; animation: pop .25s ease-out }
@keyframes pop { from { transform: translateY(-6px); opacity: 0 } to { transform: none; opacity: 1 } }
.mem-visual { display: flex; flex-wrap: wrap; gap: 8px }
.mem-visual span { font-family: var(--display); font-weight: 800; font-size: clamp(18px, 3.4vw, 24px); line-height: 1.15; padding: 8px 14px; border-radius: 10px; background: var(--surface); border: 2px solid var(--fg); box-shadow: 3px 3px 0 var(--fg) }
.mem-trick { margin: 0; font-size: 18px }
.mem-points { margin: 0; padding-left: 20px; display: grid; gap: 4px; color: var(--muted) }
@media (prefers-reduced-motion: reduce) { .memory { animation: none } }
.total { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap }
.total .pct { font-family: var(--display); font-size: 28px; font-weight: 700; color: var(--muted); font-variant-numeric: tabular-nums }
.opt.wrong .tick { color: var(--bad) }
.hint { background: var(--accent-soft); border-radius: 10px; padding: 12px 16px; margin: 0 }
.hint strong { font-family: var(--display) }
.feedback { --fb: var(--accent); --fb-bg: var(--accent-soft); margin: 0; padding: 18px 20px; border-radius: 14px; border: 2px solid var(--fb); border-left-width: 10px; background: var(--fb-bg); color: var(--fg); font-size: 18px; box-shadow: 4px 4px 0 var(--fb); animation: pop .3s ease-out }
.feedback.is-ok { --fb: var(--good); --fb-bg: var(--good-bg) } .feedback.is-no { --fb: var(--bad); --fb-bg: var(--bad-bg) }
.feedback strong { color: var(--fg) }
.fb-head { display: flex; align-items: center; gap: 12px; font-family: var(--display); font-weight: 800; font-size: clamp(24px, 4.5vw, 30px); line-height: 1.1 }
.fb-head i { font-style: normal; display: grid; place-items: center; width: 40px; height: 40px; flex: none; border-radius: 50%; background: var(--fb); color: var(--surface); font-size: 22px }
.feedback .answer-line { font-weight: 600 }
.feedback .why { padding: 12px 14px; border-radius: 10px; background: var(--surface); line-height: 1.45 }
.feedback .why strong { font-family: var(--display); text-transform: uppercase; letter-spacing: .06em; font-size: 15px; color: var(--fb) }
@media (prefers-reduced-motion: reduce) { .feedback { animation: none } }
.btn { font: inherit; font-weight: 700; padding: 12px 22px; border-radius: 999px; border: 0; background: var(--accent); color: var(--accent-ink); cursor: pointer }
.btn.ghost { background: transparent; color: var(--fg); border: 2px solid var(--line) }
.btn.ghost:hover:not(:disabled) { border-color: var(--accent) }
.btn:disabled { opacity: .45; cursor: default }
.btn:focus-visible { outline: 3px solid var(--fg); outline-offset: 2px }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center }
.score { font-family: var(--display); font-size: 64px; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums }
.review { list-style: none; padding: 0; margin: 0; display: grid }
.review li { display: grid; grid-template-columns: 28px 1fr; gap: 8px; padding-block: 10px; border-top: 1px solid var(--line) }
.review .mark { font-weight: 800; font-variant-numeric: tabular-nums } .review .ok { color: var(--good) } .review .no { color: var(--bad) }
.review small { color: var(--muted); display: block }

/* Exam-style questions: figure, typed answer, mark scheme */
.fig { margin: 0; padding: 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); overflow-x: auto }
.fig svg { display: block; width: 100%; min-width: 440px; height: auto; max-height: 380px }
@media (max-width: 520px) { .fig { padding: 6px; margin-inline: -12px } }
.fig .lbl { font: 800 17px var(--display); fill: var(--fg) }
.fig .key { font: 600 14px var(--body); fill: var(--fg) }
.fig .lead { stroke: var(--fg); stroke-width: 1.2 } .fig .dot { fill: var(--fg) }
.fig .ink { stroke: var(--fg); stroke-width: 1.6; fill: none }
.fig .cell { fill: var(--cell); stroke: var(--fg); stroke-width: 1.1 }
.fig .cellline { fill: var(--cell); stroke: var(--fg); stroke-width: 1 }
.fig .chl, .fig .chl-big { fill: var(--chl) } .fig .grana { stroke: var(--cell); stroke-width: 1.2 }
.fig .wax { fill: var(--wax); stroke: var(--fg); stroke-width: .8 }
.fig .xy { fill: var(--surface); stroke: var(--fg); stroke-width: 3 }
.fig .wall { fill: var(--cell); stroke: var(--fg); stroke-width: 3 } .fig .cyto { fill: var(--surface); stroke: var(--fg); stroke-width: 1; opacity: .9 }
.fig .sap { fill: var(--sap); stroke: var(--fg); stroke-width: 1 } .fig .nuc { fill: var(--grid-major); stroke: var(--fg); stroke-width: 1.2 } .fig .nucleolus { fill: var(--fg) }
.fig .panel { fill: var(--bg); stroke: var(--line); stroke-width: 1.5 } .fig .pore { fill: var(--grid-major); stroke: var(--fg); stroke-width: 1 }
.fig .soil { fill: var(--soil); stroke: var(--fg); stroke-width: .8 } .fig .film { fill: var(--film) }
.fig .arrow { stroke: var(--s1); stroke-width: 3 } .fig .arrow-h { fill: var(--s1) }
.fig .hollow { fill: var(--surface) } .fig .lig { stroke: var(--fg); stroke-width: 3; stroke-linecap: round; opacity: .75 } .fig .vwall { stroke: var(--fg); stroke-width: 3; fill: none }
.fig .sieve { stroke: var(--fg); stroke-width: 3.5; stroke-dasharray: 5 4 }
.fig .shade { fill: var(--grid-major); stroke: var(--fg); stroke-width: 1.4 } .fig .bulb { fill: var(--wax); stroke: var(--fg); stroke-width: 1.4 } .fig .ray { stroke: var(--wax); stroke-width: 2; stroke-dasharray: 4 4 }
.fig .ruler { fill: var(--wax); stroke: var(--fg); stroke-width: 1.2 } .fig .weed { stroke: var(--chl); stroke-width: 4; fill: none; stroke-linecap: round } .fig .bubble { fill: var(--surface); stroke: var(--fg); stroke-width: 1.2 }
.fig .g-minor line { stroke: var(--grid-minor); stroke-width: 1 } .fig .g-major line { stroke: var(--grid-major); stroke-width: 1 }
.fig .axis { stroke: var(--fg); stroke-width: 1.6; fill: none }
.fig .ticks text { font: 500 13px var(--body); fill: var(--muted); font-variant-numeric: tabular-nums }
.fig .axis-t { font: 700 14px var(--body); fill: var(--fg) }
.fig .series { fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round } .fig .s1 { stroke: var(--s1) } .fig .s2 { stroke: var(--s2); stroke-dasharray: 8 5 }
.fig .cross { stroke: var(--fg); stroke-width: 2; stroke-linecap: round }
.answer { display: grid; gap: 10px }
.ans-field { display: flex; flex-wrap: wrap; align-items: center; gap: 10px }
.ans-num { flex: 0 1 150px; width: 150px; font-variant-numeric: tabular-nums }
.ans-text { flex: 1 1 100%; min-height: 110px; resize: vertical; line-height: 1.45 } .ans-text.short { min-height: 0 }
.ans-field .unit { font-weight: 700; color: var(--muted) }
.name-input.correct { border-color: var(--good); background: var(--good-bg) } .name-input.wrong { border-color: var(--bad); background: var(--bad-bg) } .name-input.part { border-color: var(--accent); background: var(--accent-soft) }
.answer .buddy { width: 40px; height: 40px }
.feedback { display: grid; gap: 10px }
.feedback p { margin: 0 }
.feedback .model { color: var(--fg); line-height: 1.45 }
.scheme { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px }
.scheme li { display: grid; grid-template-columns: 22px 1fr; gap: 6px }
.scheme i { font-style: normal; font-weight: 800 } .scheme .hit i { color: var(--good) } .scheme .miss i { color: var(--bad) } .scheme .hit span { color: var(--fg) } .scheme .miss span { color: var(--muted) }
.progress span.part { background: linear-gradient(90deg, var(--good) 50%, var(--bad) 50%) }
.review .part { color: var(--accent) }
.fig .bar { fill: var(--s1) } .fig .note { font: 500 12px var(--body); fill: var(--muted) }
.fig .sug { fill: var(--wax); stroke: var(--fg); stroke-width: 1.5 } .fig .bond { stroke: var(--fg); stroke-width: 2.5; fill: none }
.fig .b1 { fill: var(--s1); stroke: var(--fg) } .fig .b2 { fill: var(--s2); stroke: var(--fg) } .fig .b3 { fill: var(--chl); stroke: var(--fg) } .fig .b4 { fill: var(--wax); stroke: var(--fg) }
.fig .gly { fill: var(--wax); stroke: var(--fg); stroke-width: 1.5 } .fig .chain { fill: none; stroke: var(--fg); stroke-width: 2.2; stroke-linejoin: round }
.fig .flour { fill: var(--surface); stroke: var(--fg); stroke-width: 1.2 } .fig .fatc { fill: var(--wax); stroke: var(--fg); stroke-width: .8 }
.fig .dough { fill: var(--dough); stroke: var(--fg); stroke-width: 1 } .fig .fatl { fill: var(--fat); stroke: var(--fg); stroke-width: 1 }
.fig .lbl.big { font-size: 20px }

</style>
</head>
<body>

<main class="wrap">
  <nav class="subjects" aria-label="Subject">
    <button class="subj" data-subject="foodtech">Food Tech</button>
    <button class="subj" data-subject="biology">Biology</button>
  </nav>

  <div class="topicbar">
    <label class="eyebrow" for="topic">Topic</label>
    <select class="select" id="topic"></select>
    <button class="sound" id="soundBtn" aria-pressed="true">Sound on</button>
    <button class="hs-cta" id="hsBtn" aria-haspopup="dialog">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M7 3h10v2h4v3a5 5 0 0 1-4.6 5A5 5 0 0 1 13 16.9V19h3v2H8v-2h3v-2.1A5 5 0 0 1 7.6 13 5 5 0 0 1 3 8V5h4V3Zm0 4H5v1a3 3 0 0 0 2 2.8V7Zm10 0v3.8A3 3 0 0 0 19 8V7h-2Z"/></svg>
      <span><b>High scores</b><small id="hsTop">Loading…</small></span>
    </button>
  </div>

  <div class="head">
    <div style="display:grid;gap:6px">
      <span class="eyebrow" id="kicker">Food &amp; nutrition</span>
      <h1 id="title">Fats Quiz</h1>
      <p class="player" id="playerLine" hidden>Playing as <b id="playerName"></b> · <button class="linkbtn" id="changeName">Change name</button></p>
    </div>
    <div class="versions" role="group" aria-label="Test">
      <span class="eyebrow">Test</span>
      <button class="v" id="v1" data-v="1">1</button>
      <button class="v" id="v2" data-v="2">2</button>
      <button class="v" id="v3" data-v="3">3</button>
      <button class="v" id="v4" data-v="4">4</button>
      <button class="v" id="v5" data-v="5">5</button>
    </div>
  </div>


  <!-- NAME -->
  <form class="card start" id="start">
    <span class="eyebrow">Before you start</span>
    <h2 class="q" style="margin:0">What's your name?</h2>
    <p style="margin:0;color:var(--muted)">Your best scores go on the high score board for this topic and the overall board for all four topics.</p>

  ["Omega-6 fatty acids help to…", "Lower blood cholesterol and reduce inflammation", ["Raise blood sugar", "Increase blood pressure", "Store vitamin C"], "Omega-6 helps lower blood cholesterol and reduce inflammation.", "Good for the heart and for swelling."],
  ["Omega-3 fatty acids help…", "Brain function, and may reduce heart disease risk", ["Build muscle protein", "Digest carbohydrates", "Absorb vitamin C"], "Omega-3 helps brain function and may reduce the risk of heart disease.", "Good for the head and the heart."],
  ["Omega-3 and omega-6 are also known as…", "n-3 and n-6", ["v-3 and v-6", "Type 3 and Type 6", "C-3 and C-6"], "Omega-3 and omega-6 are also called n-3 and n-6.", "A single lowercase letter, then the number."],
  ["What makes a fatty acid 'essential'?", "The body cannot make it, so it must come from food", ["It is found in every food", "It is only found in animals", "The body makes too much of it"], "Essential fatty acids cannot be made by the body, so we need them from our diet.", "Where must 'essential' nutrients come from?"],
  ["Omega-3 is found in smaller amounts in…", "Eggs from hens fed omega-3 enriched diets", ["White sugar", "Fruit juice", "Plain rice"], "Meat or eggs from animals fed omega-3 enriched diets contain some, but less than oily fish.", "It comes from animals given a special diet."],
  ["Total fat should be no more than what share of food energy?", "35%", ["11%", "50%", "2%"], "Total fat should provide no more than 35% of food energy.", "About a third."],

  ["In UK adults, which fat intake is currently too high?", "Saturated fat", ["Total fat", "Omega-3", "Monounsaturated fat"], "Average total fat intake is within the recommendation, but saturated fat intake is too high.", "Total fat is fine. It's the 'unhealthy' type that's the problem."],
  ["Replacing saturated fats with unsaturated fats can help…", "Lower cholesterol", ["Raise cholesterol", "Increase blood pressure", "Cause vitamin deficiency"], "There is good evidence this swap helps lower cholesterol, a risk factor for heart disease.", "Unsaturated fats are linked to better heart health."],
  ["Too much saturated fat in the diet can…", "Raise blood cholesterol levels", ["Cause a lack of vitamins A, D, E and K", "Lower blood pressure", "Make you feel cold faster"], "Too much saturated fat can increase blood cholesterol and restrict blood flow.", "A fatty substance in the blood goes up."],
  ["Restricted blood flow from high cholesterol increases the risk of…", "High blood pressure", ["Low blood sugar", "Vitamin C deficiency", "Tooth decay"], "Restricted blood flow raises the risk of high blood pressure and cardiovascular disease.", "Narrower vessels mean the heart pushes harder."],
  ["Which is a form of cardiovascular disease?", "Stroke", ["Type 2 diabetes", "Anaemia", "Rickets"], "CHD, stroke and heart attack are forms of cardiovascular disease.", "Cardio = heart, vascular = blood vessels. Which one cuts blood flow to the brain?"],
  ["Excess fat in the body can lead to obesity, which can lead to…", "Type 2 diabetes", ["Scurvy", "Rickets", "Anaemia"], "Obesity can lead to diet-related type 2 diabetes.", "A condition linked to blood sugar."],
  ["In type 2 diabetes, the body struggles to…", "Control blood sugar levels", ["Absorb calcium", "Make vitamin C", "Digest protein"], "Type 2 diabetes is when the body struggles to control blood sugar levels.", "Think about insulin and glucose."],
  ["Where is excess fat stored in the body?", "Under the skin and around organs", ["In the bones", "In the blood only", "In the stomach lining"], "Excess fat is stored under the skin, and around organs in some cases.", "Two places: one you can pinch, one deep inside."],
  ["What can happen if we eat too little fat?", "Fewer fat-soluble vitamins are absorbed", ["Blood cholesterol rises", "Type 2 diabetes develops", "We gain weight"], "Less fat means less vitamin A, D, E and K is absorbed, leading to deficiency.", "Fat carries some vitamins into the body."],
  ["If the diet lacks carbohydrate, the body uses ___ for energy.", "Its fat stores", ["Its bones", "Vitamin C", "Water"], "Without enough carbohydrate the body uses its fat stores, which can lead to weight loss.", "The body's backup energy supply."],
  ["A person with too little body fat may…", "Get colder faster", ["Overheat easily", "Gain weight quickly", "Have higher cholesterol"], "Less body fat means less insulation to keep the body warm.", "Body fat works like a blanket."],
  ["A thinner layer of fat under the skin means…", "Less protection from knocks", ["Stronger bones", "Better vitamin absorption", "More energy stored"], "Fat under the skin protects the body from knocks.", "Body fat works like padding."],

  ["Fat is a component of ___, which control biochemical reactions in cells.", "Hormones", ["Enzymes in saliva", "Red blood cells", "Bones"], "Fat is a component of hormones.", "The body's chemical messengers."],

  ["What is the difference between types of fatty acids?", "How carbon atoms bond with hydrogen atoms", ["How many glycerol molecules they have", "Their colour", "Whether they contain oxygen"], "The difference is in how carbon atoms bond with hydrogen atoms.", "It's about chemical bonds between two elements."],
  ["The structure of fatty acids determines their…", "Effect on health, melting point and digestibility", ["Colour and smell only", "Vitamin C content", "Protein content"], "Structure affects health effects and characteristics such as melting point and digestibility.", "Why are some fats solid and others liquid?"],

pastry: { name: "Pastry", bank: [
  ["What are the basic ingredients of pastry?", "Flour, fat, salt and water", ["Flour, sugar, eggs and milk", "Flour, yeast, salt and water", "Butter, sugar and cream"], "The basic ingredients of pastry are flour, fat, salt and water.", "Four ingredients. No raising agent or sugar needed."],
  ["How many main types of pastry are there?", "Six", ["Three", "Four", "Ten"], "The six main types are shortcrust, suet, puff, rough puff, flaky and choux.", "Shortcrust, suet, puff, rough puff, flaky, choux…"],
  ["Which of these is one of the six main types of pastry?", "Choux", ["Sourdough", "Brioche", "Focaccia"], "Choux is one of the six main pastries. The others in the list are breads.", "The others are all types of bread."],
  ["Which flour is used for shortcrust pastry?", "Plain flour", ["Strong flour", "Self-raising flour", "Rice flour"], "Shortcrust uses plain flour, which is low in protein.", "Low protein, no raising agent."],
  ["Which flour is used for suet pastry?", "Self-raising flour", ["Plain flour", "Strong flour", "Cornflour"], "Suet pastry uses self-raising flour.", "It contains a raising agent."],
  ["Which flour is used for puff, flaky, rough puff and choux pastry?", "Strong flour", ["Plain flour", "Self-raising flour", "Cornflour"], "These pastries use strong flour for gluten development.", "High protein for strength and structure."],
  ["What is the proportion of fat to flour in shortcrust pastry?", "Half fat to flour", ["Equal fat and flour", "Three-quarters fat to flour", "A quarter fat to flour"], "Shortcrust uses ½ fat to flour.", "The same proportion as suet pastry."],
  ["What is the proportion of fat to flour in puff and flaky pastry?", "Three-quarters fat to flour", ["Half fat to flour", "Twice as much fat as flour", "A quarter fat to flour"], "Flaky and puff pastry use ¾ fat to flour.", "More fat than shortcrust."],
  ["What fat is used in suet pastry?", "Shredded suet", ["Olive oil", "Lard only", "Margarine only"], "Suet pastry uses shredded suet.", "It's in the name."],
  ["Which fat is recommended for shortcrust pastry?", "Half lard and half margarine/butter, or all butter", ["Shredded suet", "Sunflower oil", "No fat at all"], "Shortcrust uses ½ lard and ½ margarine/butter, or all butter.", "A mix of two fats, or just one dairy fat."],
  ["How is shortcrust pastry made?", "Fat is cut into cubes and rubbed into the flour, then liquid is added", ["Fat and water are heated, then flour is beaten in", "Dough is rolled and folded with layers of fat", "Suet and flour are mixed with liquid"], "Shortcrust uses the rubbing-in method, then liquid is added.", "The 'rubbing-in' method."],
  ["What is added to make a richer shortcrust pastry?", "Egg yolk and sugar", ["Yeast and salt", "Extra water", "Strong flour"], "For a richer pastry, egg yolk and sugar are added.", "Two ingredients that make it sweeter and richer."],
  ["What is a laminated dough?", "A dough rolled and folded to create layers", ["A dough that is piped", "A dough with no fat", "A dough made with yeast"], "Laminated dough is rolled and folded to create layers, as in puff pastry.", "Think of the many layers in puff pastry."],
  ["In flaky and puff pastry, how much of the fat is rubbed in at the start?", "A quarter", ["All of it", "Half", "None"], "¼ of the fat is rubbed in, then the rest is added when rolling.", "Most of the fat is added later during rolling."],
  ["Rough puff pastry is…", "A quicker version of puff pastry", ["A type of choux pastry", "Made with suet", "Made without fat"], "Rough puff is a slightly quicker version of puff pastry.", "Its name gives it away."],
  ["How is rough puff pastry made?", "Fat cubes are stirred into the flour and liquid added", ["Fat and liquid are heated in a pan", "Fat is rubbed in until it looks like breadcrumbs", "It is piped from a bag"], "Rough puff: fat cut into cubes, stirred into the flour, liquid added.", "The fat stays in lumps."],
  ["How is choux pastry made?", "Fat and liquid are heated, flour worked in, then eggs added", ["Fat is rubbed into flour, then water added", "Suet and flour are mixed with liquid", "Dough is rolled and folded with fat"], "Choux: fat and liquid heated in a pan, flour worked in, eggs added to the paste.", "It's the only pastry made in a pan."],
  ["Choux pastry is different because it is…", "A paste that is piped", ["A dough that is rolled and folded", "Made with suet", "Made without eggs"], "Choux is a paste that is piped, rather than a dough that is rolled.", "Think of how eclairs are shaped."],
  ["Which products are made with choux pastry?", "Profiteroles and eclairs", ["Sausage rolls and turnovers", "Quiches and pasties", "Strudels"], "Choux is used for profiteroles and eclairs.", "Cream-filled, chocolate-topped treats."],
  ["What are the properties of cooked choux pastry?", "Light texture and hollow centre", ["Short and crumbly", "Flaky layers", "Dense and heavy"], "Choux pastry has a light texture and a hollow centre.", "Why can you fill it with cream?"],
  ["Which products are made with shortcrust pastry?", "Pies, quiches, tarts and pasties", ["Profiteroles and eclairs", "Strudels", "Croissants"], "Shortcrust is used for pies, quiches, tarts and pasties.", "Products with a firm base."],
  ["Which product is made with flaky, puff or rough puff pastry?", "Sausage rolls", ["Eclairs", "Quiche", "Profiteroles"], "Sausage rolls, pies and fruit turnovers use flaky or puff pastry.", "A savoury snack with flaky layers."],
  ["What are the properties of filo pastry?", "Light, crisp and fragile", ["Short and crumbly", "Thick and chewy", "Hollow in the centre"], "Filo is light, crisp and fragile.", "Paper-thin sheets."],
  ["Filo pastry is used for…", "Strudels and pastry parcels", ["Eclairs", "Pasties", "Suet puddings"], "Filo is used for strudels and pastry parcels.", "An apple dessert from Austria."],
  ["Shortcrust pastry has a texture described as…", "Short", ["Flaky", "Hollow", "Chewy"], "Shortcrust has a 'short' (firm and crumbly) texture.", "It's in the name."],
  ["Which two proteins are found in wheat flour?", "Gliadin and glutenin", ["Gluten and starch", "Casein and whey", "Albumin and keratin"], "Wheat flour contains gliadin and glutenin.", "Both start with 'gl'."],
  ["When water is added to flour, gliadin and glutenin form…", "Gluten", ["Starch", "Sugar", "Fat"], "With water, the two proteins combine to make gluten.", "The stretchy protein in dough."],
  ["Gluten gives dough its…", "Elastic texture and structure", ["Sweet flavour", "Brown colour", "Crumbly texture"], "Gluten is responsible for the elastic texture and structure of doughs.", "Think of stretching bread dough."],
  ["Gluten is coiled, which means it can…", "Stretch and bend", ["Dissolve in water", "Melt when heated", "Turn sweet"], "Coiled gluten can stretch and bend, giving elasticity.", "Like a spring."],
  ["Strong flour has a…", "High protein content", ["Low protein content", "High sugar content", "Raising agent added"], "Strong flour is high in protein, so it develops more gluten.", "More protein means more gluten."],
  ["Why is strong flour used for puff pastry?", "Gluten development is needed for strength and structure", ["It makes the pastry crumbly", "It makes the pastry sweet", "It stops the pastry rising"], "Puff, flaky and choux need gluten development for strength and structure.", "These pastries need to hold their shape as they rise."],
  ["Why is plain flour used for shortcrust?", "It is low in protein, so less gluten develops", ["It is high in protein", "It contains yeast", "It makes the pastry rise"], "Low-protein flour is used where gluten development is to be avoided.", "Shortcrust should be crumbly, not stretchy."],
  ["Rubbing fat into flour gives the flour particles a…", "Waterproof coating", ["Sweet coating", "Sticky coating", "Crunchy coating"], "Rubbed-in fat coats the flour particles with a waterproof layer.", "Fat and water don't mix."],
  ["The fat coating on flour particles prevents…", "Long gluten molecules forming", ["The pastry from browning", "Salt from dissolving", "The pastry from cooking"], "The coating stops long gluten molecules forming when water is added.", "Less stretch, more crumble."],
  ["Why is fat in shortcrust called 'shortening'?", "It gives a short (firm and crumbly) texture", ["It shortens the cooking time", "It makes the pastry shorter in height", "It shortens the shelf life"], "Fat stops the dough being stretchy, keeping a short texture: hence 'shortening'.", "It's about the texture."],
  ["Why is shortening used for filled pies and tarts?", "The base doesn't rise and forms a solid case", ["It makes the base rise high", "It makes the pastry hollow", "It makes the pastry sweeter"], "Shortening keeps the base flat and solid so it can hold a filling.", "The base needs to hold a filling."],
  ["How does fat help flaky and puff pastry?", "It separates the layers by creating steam", ["It stops the pastry rising", "It adds sweetness", "It makes the pastry crumbly"], "Fat helps separate the layers by creating steam as it cooks.", "What happens to water in a hot oven?"],
  ["What does salt do for the flavour of pastry?", "Enhances flavour and stops it tasting flat", ["Makes it taste sweet", "Has no effect", "Makes it bitter"], "Salt enhances flavour and prevents pastry tasting flat or dull.", "Think of seasoning."],
  ["How does salt affect the protein in flour?", "It tightens the protein bonds, giving structure", ["It breaks down the protein", "It turns protein into sugar", "It has no effect"], "Salt tightens protein bonds, giving elasticity and structure.", "It holds the dough together."],
  ["In laminated doughs, salt helps to…", "Absorb moisture evenly and prevent stickiness", ["Melt the fat", "Make the dough sweet", "Stop the pastry rising"], "Salt helps dough absorb moisture evenly and prevents stickiness.", "It's about water and stickiness."],
  ["Why does sweet pastry turn brown when cooked?", "Sugar caramelises when heated", ["Salt burns", "Flour turns brown in water", "Fat goes off"], "Sugar caramelises when heated, giving cooked pastry its brown colour.", "Think of toffee."],
  ["What does sugar do to the gluten in sweet pastry?", "Softens it, giving a soft crumb and moist texture", ["Strengthens it", "Makes it stretchy", "Removes it completely"], "Sugar softens gluten, giving a soft crumb and moist texture.", "It makes the pastry softer."],
  ["What happens if shortcrust pastry is stretched or too wet?", "It becomes tough and shrinks from the dish", ["It becomes flaky", "It rises well", "It turns sweet"], "Stretched or wet shortcrust becomes tough and shrinks from the dish.", "It pulls back when cooked."],
  ["What happens if shortcrust pastry is over-kneaded?", "It becomes hard and leathery", ["It becomes light and flaky", "It becomes hollow", "It becomes sweeter"], "Over-kneading develops gluten, making pastry hard and leathery.", "Too much gluten develops."],
  ["Puff pastry that doesn't rise is usually caused by…", "Opening the oven door or the oven not being hot enough", ["Using too much salt", "Using strong flour", "Resting the dough"], "Flat puff pastry is due to opening the oven door or the oven not being hot enough.", "The steam needs lots of heat."],
  ["Which is the first technique in pastry making?", "Sieving the flour and salt", ["Rolling", "Resting", "Cooking"], "The techniques in order: sieving, rubbing-in, adding liquid, resting, rolling, cooking.", "Before you rub in the fat."],
  ["Which technique comes straight after adding the liquid?", "Resting", ["Sieving", "Rubbing-in", "Cooking"], "After adding liquid, the dough is rested, then rolled and cooked.", "Let the dough relax before rolling."],
]},

photo: { name: "Photosynthesis", bank: [
  ["What is the word equation for photosynthesis?", "carbon dioxide + water → glucose + oxygen", ["glucose + oxygen → carbon dioxide + water", "carbon dioxide + oxygen → glucose + water", "water + oxygen → glucose + carbon dioxide"], "Plants take in carbon dioxide and water and use light energy to make glucose and oxygen.", "The reactants are what the plant takes in from the air and the soil."],
  ["Which is the balanced symbol equation for photosynthesis?", "6CO₂ + 6H₂O → C₆H₁₂O₆ + 6O₂", ["C₆H₁₂O₆ + 6O₂ → 6CO₂ + 6H₂O", "6CO₂ + 6H₂O → C₆H₁₂O₆ + 3O₂", "CO₂ + H₂O → C₆H₁₂O₆ + O₂"], "Six carbon dioxide and six water make one glucose and six oxygen.", "There's a 6 in front of everything except glucose."],
  ["What is the chemical formula of glucose?", "C₆H₁₂O₆", ["C₁₂H₂₂O₁₁", "C₆H₆O₆", "CO₂"], "Glucose is C₆H₁₂O₆: 6 carbon, 12 hydrogen, 6 oxygen.", "Think 6-12-6."],
  ["Where does a plant get the carbon dioxide it needs for photosynthesis?", "From the air, through the stomata", ["From the soil, through root hair cells", "It is made in the chloroplasts", "From water in the xylem"], "Carbon dioxide diffuses from the air into the leaf through the stomata.", "It's a gas, so where would it come from?"],
  ["Where does a plant get the water it needs for photosynthesis?", "From the soil, through root hair cells", ["From the air, through the stomata", "It is made by respiration in the leaf", "From the phloem"], "Water is absorbed from the soil by root hair cells, then carried up the xylem to the leaves.", "Think about what the roots are for."],
  ["How does carbon dioxide get into the leaf?", "Diffusion", ["Osmosis", "Active transport", "Translocation"], "CO₂ diffuses into the leaf because its concentration is lower inside, where it's being used up.", "Gases move from high to low concentration."],
  ["Where does the energy for photosynthesis come from?", "Light", ["Heat from the soil", "Glucose", "Oxygen"], "Light energy is absorbed by chlorophyll and used to make glucose.", "'Photo' means light."],
  ["Photosynthesis is an endothermic reaction. What does this mean?", "It takes in energy from the surroundings", ["It gives out energy to the surroundings", "It only happens at night", "It doesn't need energy"], "Photosynthesis takes in light energy, so it is endothermic.", "ENdothermic: energy goes IN."],
  ["In which part of a plant cell does photosynthesis take place?", "Chloroplasts", ["Mitochondria", "Nucleus", "Vacuole"], "Photosynthesis happens in the chloroplasts.", "The green parts of the cell."],
  ["What is the green pigment that absorbs light for photosynthesis?", "Chlorophyll", ["Cellulose", "Starch", "Lignin"], "Chlorophyll in the chloroplasts absorbs light energy.", "It's inside chloroplasts and starts with 'chloro-'."],
  ["What happens to the oxygen made in photosynthesis?", "It is released through the stomata or used in respiration", ["It is stored as starch", "It is sent to the roots in the phloem", "It is turned back into glucose"], "Oxygen diffuses out through the stomata, or the plant uses some for respiration.", "It's a waste gas the plant doesn't need much of."],
  ["Plants convert some glucose into ___ so it can be stored.", "Starch", ["Cellulose", "Protein", "Chlorophyll"], "Glucose is turned into insoluble starch for storage, e.g. in roots and tubers.", "Potatoes are full of it."],
  ["Plants use glucose to make cellulose. What is cellulose used for?", "Strengthening cell walls", ["Absorbing light", "Carrying water up the stem", "Opening the stomata"], "Cellulose is used to build strong cell walls.", "The 'cell-' in cellulose is a clue."],
  ["Plants combine glucose with nitrate ions to make…", "Amino acids, for protein synthesis", ["Starch", "Cellulose", "Oils"], "Glucose + nitrate ions make amino acids, which are built into proteins.", "Nitrates contain nitrogen, which proteins need."],
  ["Plants use glucose in respiration to…", "Release energy", ["Make oxygen", "Absorb light", "Store water"], "Respiration releases the energy from glucose for the cell's processes.", "The same reason we use glucose."],
  ["Seeds often store energy as…", "Fats or oils", ["Cellulose", "Nitrates", "Lignin"], "Glucose can be turned into fats or oils and stored in seeds.", "Think sunflower oil or olive oil."],
  ["What is a limiting factor?", "The factor in shortest supply that stops the rate going up", ["The factor that is always highest", "Any factor that always increases the rate", "The amount of glucose a plant stores"], "A limiting factor is whatever is in shortest supply, holding the rate back.", "Think of the slowest person holding up a queue."],
  ["Which of these is a limiting factor for photosynthesis?", "Light intensity", ["Oxygen concentration", "Amount of starch", "Colour of the soil"], "Light intensity, CO₂ concentration and temperature can all limit photosynthesis.", "What does photosynthesis need to get its energy?"],
  ["What are the three main limiting factors of photosynthesis?", "Light intensity, CO₂ concentration and temperature", ["Oxygen, glucose and starch", "Wind, humidity and rainfall", "Nitrates, water vapour and lignin"], "Light intensity, carbon dioxide concentration and temperature limit the rate.", "One gives energy, one is a reactant, one affects enzymes."],
  ["What happens to the rate of photosynthesis if the temperature gets too high?", "It falls, because enzymes are denatured", ["It keeps increasing", "Chlorophyll turns into glucose", "The stomata absorb more light"], "Above the optimum, the enzymes that control photosynthesis denature, so the rate drops.", "Photosynthesis is controlled by enzymes."],
  ["On a graph, the rate rises with light intensity, then levels off. Why does it level off?", "Another factor, e.g. CO₂ or temperature, is now limiting", ["Light has stopped reaching the plant", "The plant has run out of glucose", "Photosynthesis has stopped"], "Once light is no longer the limit, something else (CO₂ or temperature) holds the rate back.", "Light isn't in short supply any more."],
  ["(Higher) If you double the distance between a lamp and a plant, the light intensity…", "Falls to a quarter", ["Halves", "Doubles", "Stays the same"], "Light intensity follows the inverse square law: 1 ÷ 2² = ¼.", "Use 1 ÷ distance²."],
  ["(Higher) Which shows the inverse square law for light intensity?", "Light intensity ∝ 1 ÷ distance²", ["Light intensity ∝ distance²", "Light intensity ∝ 1 ÷ distance", "Light intensity ∝ distance"], "Light intensity is inversely proportional to the square of the distance.", "'Inverse' means 1 ÷, 'square' means ²."],
  ["How can a farmer increase the rate of photosynthesis in a greenhouse?", "Add heating, extra lighting and extra CO₂", ["Open the doors to cool it down", "Remove all the water", "Add more oxygen"], "Greenhouses control the limiting factors: heat, light and CO₂.", "Raise the three limiting factors."],
  ["What is the function of a chloroplast?", "Contains chlorophyll, which absorbs light for photosynthesis", ["Controls what enters and leaves the cell", "Releases energy by respiration", "Stores cell sap"], "Chloroplasts are where photosynthesis happens.", "It's green."],
  ["What does the permanent vacuole do?", "Contains cell sap and keeps the cell firm", ["Makes proteins", "Carries out photosynthesis", "Controls the cell's activities"], "The vacuole is filled with cell sap, which keeps the cell turgid and firm.", "A big bag of liquid in the middle of the cell."],
  ["What does the cell wall do?", "Strengthens and supports the cell", ["Controls what enters and leaves", "Absorbs light", "Releases energy"], "The cellulose cell wall gives the cell strength and support.", "It's the rigid outer layer."],
  ["What does the cell membrane do?", "Controls what enters and leaves the cell", ["Strengthens the cell", "Absorbs light", "Contains genetic material"], "The membrane controls which substances pass in and out.", "It's like a security guard."],
  ["What does the nucleus do?", "Contains genetic material and controls the cell's activities", ["Releases energy", "Makes glucose", "Stores cell sap"], "The nucleus holds the DNA and controls the cell.", "The cell's control centre."],
  ["What happens in the mitochondria?", "Aerobic respiration releases energy", ["Photosynthesis makes glucose", "Proteins are made", "Cell sap is stored"], "Mitochondria are where aerobic respiration releases energy.", "The cell's power station."],
  ["What is the cytoplasm?", "Where most of the cell's chemical reactions happen", ["The outer layer that supports the cell", "Where photosynthesis happens", "Where DNA is stored"], "The cytoplasm is the jelly where most chemical reactions take place.", "The jelly that fills the cell."],
  ["What do ribosomes do?", "Make proteins (protein synthesis)", ["Absorb light", "Store starch", "Control the stomata"], "Ribosomes are where proteins are made.", "Tiny protein factories."],
  ["Which structures are found in plant cells but not animal cells?", "Cell wall, chloroplasts and a permanent vacuole", ["Nucleus, cell membrane and cytoplasm", "Mitochondria and ribosomes", "Nucleus and mitochondria"], "Only plant cells have a cell wall, chloroplasts and a permanent vacuole.", "Three extras that help plants stand up and make food."],
  ["What is the plant cell wall made of?", "Cellulose", ["Starch", "Lignin", "Protein"], "Plant cell walls are made of cellulose.", "It's made from glucose and sounds like 'cell'."],
  ["Which plant cell does NOT contain chloroplasts?", "Root hair cell", ["Palisade mesophyll cell", "Guard cell", "Spongy mesophyll cell"], "Root hair cells have no chloroplasts.", "Which one lives underground?"],
  ["Why don't root hair cells have chloroplasts?", "They are underground, where there is no light", ["They are too small", "They make glucose another way", "They are dead cells"], "Root hair cells are in the dark soil, so they can't photosynthesise.", "What does photosynthesis need that soil doesn't have?"],
  ["Which gas is given off during photosynthesis?", "Oxygen", ["Carbon dioxide", "Nitrogen", "Water vapour"], "Photosynthesis produces oxygen as a by-product.", "The gas we breathe in."],
  ["When do plants respire?", "All the time, day and night", ["Only at night", "Only in daylight", "Never, they only photosynthesise"], "Plants respire all the time to release energy. They only photosynthesise in the light.", "Every living cell needs energy, all the time."],
  ["In which leaf cells does most photosynthesis happen?", "Palisade mesophyll cells", ["Upper epidermis cells", "Xylem cells", "Root hair cells"], "Palisade cells are packed with chloroplasts near the top of the leaf.", "The tall cells near the top of the leaf."],
]},

leaf: { name: "Leaf structure", bank: [

const norm = s => " " + s.toLowerCase().replace(/[₂²]/g, "2").replace(/co\s+2/g, "co2").replace(/[’']/g, "'").replace(/[^a-z0-9'%.]+/g, " ").trim() + " ";
function lev(a, b) {
  let prev = [...Array(b.length + 1).keys()];
  for (let x = 1; x <= a.length; x++) {
    const cur = [x];
    for (let y = 1; y <= b.length; y++) cur[y] = Math.min(prev[y] + 1, cur[y - 1] + 1, prev[y - 1] + (a[x - 1] === b[y - 1] ? 0 : 1));
    prev = cur;
  }
  return prev[b.length];
}
// A stem matches the start of a word (one typo allowed in longer stems); a stem with a space must appear as a phrase
const hasStem = (t, words, st) => st.includes(" ") ? t.includes(" " + st) :
  words.some(w => w.startsWith(st) || (st.length >= 5 && w.length >= st.length - 1 && lev(w.slice(0, st.length), st) <= 1));
function markText(item, answer) {
  const t = norm(answer), words = t.trim().split(" ");
  const hits = item.marks.map(m => m.k.every(g => g.some(st => hasStem(t, words, st))));
  return { hits, got: Math.min(hits.filter(Boolean).length, maxOf(item)) };
}
function parseNum(s) {
  s = s.replace(/,/g, "").replace(/\s+/g, "");

}

const svgOpen = (vb, label) => `<svg viewBox="${vb}" role="img" aria-label="${label}" xmlns="http://www.w3.org/2000/svg">`;

// Monotone cubic through screen points, so curves never overshoot the data
function smoothPath(P) {
  const n = P.length, d = [], t = [];
  for (let k = 0; k < n - 1; k++) d.push((P[k + 1][1] - P[k][1]) / (P[k + 1][0] - P[k][0]));
  t[0] = d[0]; t[n - 1] = d[n - 2];
  for (let k = 1; k < n - 1; k++) t[k] = d[k - 1] * d[k] <= 0 ? 0 : (d[k - 1] + d[k]) / 2;
  for (let k = 0; k < n - 1; k++) {
    if (d[k] === 0) { t[k] = t[k + 1] = 0; continue; }
    const a = t[k] / d[k], b = t[k + 1] / d[k], h = a * a + b * b;
    if (h > 9) { const r = 3 / Math.sqrt(h); t[k] = r * a * d[k]; t[k + 1] = r * b * d[k]; }
  }
  let p = `M${P[0][0]},${P[0][1]}`;
  for (let k = 0; k < n - 1; k++) {
    const dx = (P[k + 1][0] - P[k][0]) / 3;
    p += ` C${P[k][0] + dx},${P[k][1] + t[k] * dx} ${P[k + 1][0] - dx},${P[k + 1][1] - t[k + 1] * dx} ${P[k + 1][0]},${P[k + 1][1]}`;
  }
  return p;
}

// Exam-style line graph on graph paper. No hover values: reading the graph is the question.
function lineChart({ title, x, y, series }) {
  const W = 520, H = 340, m = { l: 62, r: series.length > 1 ? 112 : 24, t: 14, b: 58 }, pw = W - m.l - m.r, ph = H - m.t - m.b;
  const X = v => +(m.l + (v - x.min) / (x.max - x.min) * pw).toFixed(1), Y = v => +(m.t + ph - (v - y.min) / (y.max - y.min) * ph).toFixed(1);
  let s = svgOpen(`0 0 ${W} ${H}`, title), minor = "", major = "", ticks = "";
  const axis = (a, horiz) => {
    const sub = a.minor || 5, n = Math.round((a.max - a.min) / a.step * sub);
    for (let k = 0; k <= n; k++) {
      const v = a.min + k * a.step / sub, line = horiz ? `<line x1="${X(v)}" y1="${m.t}" x2="${X(v)}" y2="${m.t + ph}"/>` : `<line x1="${m.l}" y1="${Y(v)}" x2="${m.l + pw}" y2="${Y(v)}"/>`;
      if (k % sub) { minor += line; continue; }
      major += line;
      const txt = +v.toFixed(4);
      ticks += horiz ? `<text x="${X(v)}" y="${m.t + ph + 18}" text-anchor="middle">${txt}</text>` : `<text x="${m.l - 8}" y="${Y(v)}" text-anchor="end" dominant-baseline="middle">${txt}</text>`;
    }
  };
  axis(x, true); axis(y, false);
  s += `<g class="g-minor">${minor}</g><g class="g-major">${major}</g>`;
  s += `<path d="M${m.l},${m.t} V${m.t + ph} H${m.l + pw}" class="axis"/><g class="ticks">${ticks}</g>`;
  s += `<text x="${m.l + pw / 2}" y="${H - 10}" class="axis-t" text-anchor="middle">${x.label}</text>`;
  s += `<text transform="translate(16 ${m.t + ph / 2}) rotate(-90)" class="axis-t" text-anchor="middle">${y.label}</text>`;
  series.forEach((sr, n) => {
    const P = sr.line.map(([a, b]) => [X(a), Y(b)]);
    s += `<path d="${sr.curve ? smoothPath(P) : "M" + P.join(" L")}" class="series s${n + 1}"/>`;
    (sr.crosses || []).forEach(([a, b]) => { const cx = X(a), cy = Y(b); s += `<path d="M${cx - 5},${cy - 5} L${cx + 5},${cy + 5} M${cx + 5},${cy - 5} L${cx - 5},${cy + 5}" class="cross"/>`; });
    if (series.length > 1) {

      s += `<line x1="${lx + 8}" y1="${ly + dy}" x2="${lx + 26}" y2="${ly + dy}" class="series s${n + 1}"/><text x="${lx + 32}" y="${ly + dy}" class="key" dominant-baseline="middle">${sr.name}</text>`;
    }
  });
  return s + "</svg>";
}

// Seeded random so each test always has the same questions; questions run in slide order
function rng(seed) { return () => { seed = (seed + 0x6D2B79F5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t ^= t + Math.imul(t ^ (t >>> 7), 61 | t); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }

function seedFor(s) { let h = 0; for (const ch of s) h = (h * 31 + ch.charCodeAt(0)) | 0; return h; }

// Each test gets its own share of questions found in no other test, topped up from the rest; returns sorted indexes
function pickTests(n, count, s) {
  const uniq = Math.min(Math.floor(count / 2), Math.floor(n / 5));
  const base = shuffle([...Array(n).keys()], rng(s + 2026));
  return [0, 1, 2, 3, 4].map(v => {
    const own = base.slice(v * uniq, v * uniq + uniq);
    const rest = shuffle(base.filter(k => !own.includes(k)), rng(s + 100 + v)).slice(0, count - own.length);
    return [...own, ...rest].sort((x, y) => x - y);
  });
}
// Multiple choice in slide order; any exam-style questions go in every third slot
function buildVersions(key, bank) {
  const s = seedFor(key), exam = EXAM[key] || [], nx = exam.length ? EXAM_PER_TEST : 0;
  const mcq = pickTests(bank.length, PER_QUIZ - nx, s), xs = nx ? pickTests(exam.length, nx, s + 7) : [];
  return [0, 1, 2, 3, 4].map(v => {
    const r = rng(s + 500 + v), withOpts = it => it.type === "mcq" || !it.type ? { ...it, type: "mcq", opts: shuffle([it.a, ...it.w], r) } : { ...it };
    const a = mcq[v].map(n => withOpts(bank[n])), b = nx ? xs[v].map(n => withOpts(exam[n])) : [];
    const out = [];
    for (let k = 0; k < PER_QUIZ; k++) out.push((k % 3 === 2 && b.length) || !a.length ? b.shift() : a.shift());
    return out;
  });
}

// Best attempt per person: higher percentage, then fewer hints, then earlier (old scores without max were out of 20)
const pctOf = s => s.score / (s.max || 20);
const better = (a, b) => pctOf(a) !== pctOf(b) ? pctOf(a) > pctOf(b) : a.hints !== b.hints ? a.hints < b.hints : a.at < b.at;
function topicBoard(key) {
  const best = new Map(), tries = new Map();
  allScores.filter(s => s.topic === key).forEach(s => {
    const k = nameKey(s.name); tries.set(k, (tries.get(k) || 0) + 1);
    if (!best.has(k) || better(s, best.get(k))) best.set(k, s);
  });
  return [...best.entries()].map(([k, s]) => ({ ...s, key: k, tries: tries.get(k) }))
    .sort((a, b) => pctOf(b) - pctOf(a) || a.hints - b.hints || (a.at < b.at ? -1 : 1));
}
function overallBoard(subj = subject) {
  const people = new Map();
  for (const key of SUBJECTS[subj].topics) topicBoard(key).forEach(s => {
    const p = people.get(s.key) || { key: s.key, name: s.name, sum: 0, done: 0, by: {} };
    p.by[key] = Math.round(pctOf(s) * 100); p.sum += pctOf(s) * 100; p.done++; people.set(s.key, p);
  });
  // Overall = average of each person's best % across all the subject's topics (a topic not tried counts as 0)
  people.forEach(p => p.total = Math.round(p.sum / SUBJECTS[subj].topics.length));
  return [...people.values()].sort((a, b) => b.total - a.total || b.done - a.done || a.name.localeCompare(b.name));
}

}

}

  SUBJECTS[subj].topics.forEach(k => { const o = document.createElement("option"); o.value = k; o.textContent = TOPICS[k].name; $("topic").appendChild(o); });
  const saved = store.get("quizTopic_" + subj);
  setTopic(key || (SUBJECTS[subj].topics.includes(saved) ? saved : SUBJECTS[subj].topics[0]));
}
function setTopic(key) {
  topic = key; store.set("nutritionQuizTopic", key); store.set("quizTopic_" + subject, key);
  const t = TOPICS[key];
  $("topic").value = key;
  $("title").textContent = `${t.name} Quiz`;
  $("kicker").textContent = `${SUBJECTS[subject].kicker} · ${t.bank.length + (EXAM[key]?.length || 0)} questions`;
  VERSIONS = buildVersions(key, t.bank);
  setVersion(version);
  updateCta();
}
function setVersion(v) {
  version = v; store.set("fatsQuizVersion", v);
  document.querySelectorAll(".v").forEach(b => b.setAttribute("aria-pressed", String(+b.dataset.v === v)));
  startQuiz();
}

/* ---------- quiz ---------- */
function startQuiz() {
  quiz = VERSIONS[version - 1]; i = 0; results = [];
  $("progress").innerHTML = quiz.map(() => "<span></span>").join("");
  $("done").hidden = true; $("play").hidden = !started;
  show();
}
function updateRunning() {
  const got = results.reduce((t, r) => t + r.got, 0), max = results.reduce((t, r) => t + r.max, 0);
  $("running").textContent = max ? `${got}/${max}` : "0";
}
function show() {
  const item = quiz[i], max = maxOf(item); answered = false; hintUsed = false;
  clearTimeout(nextTimer); $("next").disabled = false;
  $("qnum").textContent = `Test ${version} · Question ${i + 1} of ${quiz.length}` + (item.type === "mcq" ? "" : ` · ${max} mark${max > 1 ? "s" : ""}`);
  updateRunning();
  $("qtext").textContent = item.q;
  $("qfig").hidden = !item.fig; $("qfig").innerHTML = item.fig ? figure(item.fig) : "";
  $("opts").innerHTML = ""; $("opts").hidden = item.type !== "mcq"; $("answer").hidden = item.type === "mcq";
  if (item.type === "mcq") item.opts.forEach((txt, n) => {
    const b = document.createElement("button");
    b.className = "opt"; b.id = "opt" + n;
    b.innerHTML = `<kbd>${n + 1}</kbd><span></span>`;
    b.querySelector("span").textContent = txt;
    b.onclick = () => choose(txt);
    $("opts").appendChild(b);
  });
  else {
    const num = item.type === "num";
    $("ansField").innerHTML = num ? `<input class="name-input ans-num" id="ansIn" inputmode="decimal" autocomplete="off" spellcheck="false">` : `<textarea class="name-input ans-text${max > 1 ? "" : " short"}" id="ansIn" rows="${max > 1 ? 4 : 2}"></textarea>`;
    if (item.unit) { const u = document.createElement("span"); u.className = "unit"; u.textContent = item.unit; $("ansField").appendChild(u); }
    $("ansTip").textContent = num ? "Numbers only. Press Enter to mark." : "Write in full sentences. Ctrl + Enter to mark.";
    $("markBtn").hidden = false; $("ansErr").hidden = true;
  }
  $("hintBox").hidden = true; $("hintBtn").hidden = false; $("hintBtn").disabled = false;
  $("feedback").hidden = true; $("next").hidden = true;
  $("rememberBtn").hidden = true; $("memory").hidden = true; $("rememberBtn").setAttribute("aria-expanded", "false");
  $("progress").children[i].className = "now";
}
function showHint() {
  if (answered) return;
  hintUsed = true;
  $("hintBox").innerHTML = "<strong>Hint:</strong> ";
  $("hintBox").append(quiz[i].hint);
  $("hintBox").hidden = false; $("hintBtn").disabled = true;
}
function choose(txt) {
  if (answered) return;
  const item = quiz[i], ok = txt === item.a;
  [...$("opts").children].forEach(b => {
    b.disabled = true;
    const t = b.querySelector("span").textContent;
    const mark = (cls, sym, label) => { b.classList.add(cls); b.insertAdjacentHTML("beforeend", `<i class="tick" aria-label="${label}">${sym}</i>`); };
    if (t === item.a) { mark("correct", "✓", "Correct answer"); if (ok) b.insertBefore(pixelBuddy(), b.querySelector(".tick")); }
    else if (t === txt) mark("wrong", "✗", "Wrong answer");
  });
  settle(item, txt, ok ? 1 : 0);
}
function markWritten() {
  if (answered) return;
  const item = quiz[i], txt = $("ansIn").value.trim();
  if (!txt) { $("ansErr").textContent = "Type your answer first."; $("ansErr").hidden = false; $("ansIn").focus(); return; }
  let got, hits;
  if (item.type === "num") {
    const v = parseNum(txt);
    if (v === null) { $("ansErr").textContent = "Type a number, e.g. 12.5"; $("ansErr").hidden = false; $("ansIn").focus(); return; }
    got = Math.abs(v - item.ans) <= item.tol + 1e-9 ? maxOf(item) : 0;
  } else ({ got, hits } = markText(item, txt));
  $("ansIn").readOnly = true; $("markBtn").hidden = true; $("ansErr").hidden = true;
  $("ansIn").classList.add(got === maxOf(item) ? "correct" : got ? "part" : "wrong");
  if (got === maxOf(item)) $("ansTip").replaceChildren(pixelBuddy()); else $("ansTip").textContent = "";
  settle(item, txt, got, hits);
}
// Record the mark and show feedback, the mark scheme and the memory card
function settle(item, txt, got, hits) {
  answered = true;
  const max = maxOf(item), ok = got === max;
  results.push({ item, txt, got, max, ok, hint: hintUsed });
  playSound(got > 0);
  $("progress").children[i].className = ok ? "ok" : got ? "part" : "no";
  updateRunning();
  // Feedback panel: coloured by result, with a big verdict so the explanation isn't skipped
  const fb = $("feedback"), para = (cls, lead, text) => { const p = document.createElement("p"); p.className = cls; if (lead) p.append(Object.assign(document.createElement("strong"), { textContent: lead }), " "); p.append(text); fb.append(p); return p; };
  fb.innerHTML = ""; fb.className = "feedback " + (ok ? "is-ok" : got ? "is-part" : "is-no");
  const head = document.createElement("div"); head.className = "fb-head";
  head.innerHTML = `<i aria-hidden="true">${ok ? "✓" : got ? "◐" : "✗"}</i><span></span>`;
  head.querySelector("span").textContent = item.type === "text" ? `${got}/${max} mark${max > 1 ? "s" : ""}${ok ? " · full marks" : ""}` : ok ? "Correct!" : "Not quite";
  fb.append(head);
  if (item.type === "text") {
    para("eyebrow", "", item.any ? `Mark scheme · any ${item.any}` : "Mark scheme");
    const ul = document.createElement("ul"); ul.className = "scheme";
    item.marks.forEach((m, n) => { const li = document.createElement("li"); li.className = hits[n] ? "hit" : "miss";
      li.innerHTML = `<i aria-label="${hits[n] ? "You got this point" : "Missed"}">${hits[n] ? "✓" : "✗"}</i><span></span>`; li.querySelector("span").textContent = m.p; ul.appendChild(li); });
    fb.append(ul);
    para("model", "Model answer:", item.model);
    if (item.why) para("why", "Why:", item.why);
  } else {
    if (!ok) para("answer-line", "The answer is", ansText(item) + ".");
    para("why", "Why:", item.why);
  }
  fb.hidden = false; $("hintBtn").hidden = true;
  $("next").textContent = i === quiz.length - 1 ? "See my score" : "Next question";
  $("next").hidden = false;
  // After a miss, pause briefly on the explanation before moving on is possible
  if (!ok) { $("next").disabled = true; nextTimer = setTimeout(() => { $("next").disabled = false; $("next").focus({ preventScroll: true }); }, 1500); }
  else $("next").focus({ preventScroll: true });
  const r = fb.getBoundingClientRect();
  if (r.bottom > innerHeight) fb.scrollIntoView({ block: "center", behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" });
  const mem = memoryFor(topic, item);
  if (mem) {
    $("memTitle").textContent = mem.title;
    $("memVisual").innerHTML = "";
    mem.visual.forEach(v => { const s = document.createElement("span"); s.textContent = v; $("memVisual").appendChild(s); });
    $("memTrick").textContent = mem.mnemonic;
    $("memPoints").innerHTML = "";
    mem.points.forEach(p => { const li = document.createElement("li"); li.textContent = p; $("memPoints").appendChild(li); });
    $("rememberBtn").hidden = false;
  }
}
function toggleMemory() {
  const open = $("memory").hidden;
  $("memory").hidden = !open;
  $("rememberBtn").setAttribute("aria-expanded", String(open));
}
// A random, symmetric 8x8 pixel character that walks, waves and blinks
function pixelBuddy() {
  const N = 8, cv = document.createElement("canvas");
  cv.width = cv.height = N; cv.className = "buddy"; cv.setAttribute("aria-hidden", "true");
  const g = cv.getContext("2d"), hue = Math.floor(Math.random() * 360);
  const body = `hsl(${hue} 80% 45%)`, shade = `hsl(${hue} 80% 28%)`;
  // Random body (rows 1-5, columns 1-3), mirrored so it looks like a creature
  const cells = [];
  for (let y = 1; y <= 5; y++) for (let x = 1; x < N / 2; x++) if (Math.random() < 0.6) cells.push([x, y]);
  cells.push([2, 5], [3, 5], [3, 1]);             // always a solid torso and a head top, so it never looks like scattered dots
  const px = (x, y) => { g.fillRect(x, y, 1, 1); g.fillRect(N - 1 - x, y, 1, 1); };

  function draw(f, blink) {
    g.clearRect(0, 0, N, N);
    g.fillStyle = body;
    cells.forEach(([x, y]) => px(x, y));
    g.fillRect(2, 2, 4, 3);                       // head, so it always has a face
    px(0, f ? 2 : 4);                             // arms: up on one frame, down on the other
    g.fillStyle = shade;
    if (f) { px(2, 6); px(1, 7); } else { px(3, 6); px(3, 7); }  // legs: apart, then together
    if (!blink) {
      g.fillStyle = "#fff"; px(2, 3);
      g.fillStyle = "#111"; g.fillRect(2, 3, 1, .5); g.fillRect(5, 3, 1, .5);
    }
  }

  let f = 0, tick = 0;
  draw(0, false);
  if (!matchMedia("(prefers-reduced-motion: reduce)").matches) {
    const id = setInterval(() => {
      if (tick > 2 && !cv.isConnected) return clearInterval(id);  // stop once the question changes
      tick++; f ^= 1;
      draw(f, tick % 12 === 0);                   // blink every few seconds
    }, 260);
  }
  return cv;
}

function next() { i++; i < quiz.length ? show() : finish(); }
function finish() {
  $("play").hidden = true; $("done").hidden = false;
  const n = results.reduce((t, r) => t + r.got, 0), total = results.reduce((t, r) => t + r.max, 0), hints = results.filter(r => r.hint).length;
  const pct = Math.round(n / total * 100), allMcq = results.every(r => r.item.type === "mcq");
  $("doneLabel").textContent = `${TOPICS[topic].name} · Test ${version} · Total ${allMcq ? "score" : "marks"}`;
  $("score").textContent = `${n}/${total}`;
  $("pct").textContent = allMcq ? `${pct}% · ${n} right, ${total - n} wrong` : `${pct}% · ${n} of ${total} marks`;
  const v = n === total ? `Perfect score. You know your ${TOPICS[topic].name.toLowerCase()}.` : pct >= 75 ? "Strong work. Check the ones you missed below." : pct >= 50 ? "A good start. Revise the missed questions and try again." : "Look back over the slides, use the hints, then have another go.";
  $("verdict").textContent = v + (hints ? ` You used ${hints} hint${hints > 1 ? "s" : ""}.` : "");
  $("nextVersion").textContent = `Try test ${version % 5 + 1}`;
  $("review").innerHTML = "";
  results.forEach((r, k) => {
    const li = document.createElement("li");
    li.innerHTML = `<span class="mark ${r.ok ? "ok" : r.got ? "part" : "no"}">${k + 1}</span><div><span></span><small></small></div>`;
    li.querySelector("div span").textContent = r.item.q;
    const it = r.item;
    li.querySelector("small").textContent = (it.type === "text" ? `${r.got}/${r.max} marks · Model answer: ${it.model}` :
      r.ok ? `✓ ${ansText(it)}` : `✗ Answer: ${ansText(it)} (you said ${r.txt})`) + (r.max > 1 && it.type === "num" ? ` · ${r.got}/${r.max} marks` : "") + (r.hint ? " · hint used" : "");
    $("review").appendChild(li);
  });
  postResult(n, total, hints);
}


/* ---------- wiring ---------- */
$("topic").onchange = e => setTopic(e.target.value);
document.querySelectorAll(".subj").forEach(b => b.onclick = () => { if (b.dataset.subject !== subject) setSubject(b.dataset.subject); });
document.querySelectorAll(".v").forEach(b => b.onclick = () => setVersion(+b.dataset.v));
$("hintBtn").onclick = showHint;
$("rememberBtn").onclick = toggleMemory;
$("next").onclick = next;
$("markBtn").onclick = markWritten;
$("ansField").addEventListener("keydown", e => { if (e.key === "Enter" && (e.target.tagName === "INPUT" || e.metaKey || e.ctrlKey)) { e.preventDefault(); markWritten(); } });
$("again").onclick = () => startQuiz();
$("nextVersion").onclick = () => setVersion(version % 5 + 1);
$("start").onsubmit = e => { e.preventDefault(); beginAs($("nameInput").value); };
$("changeName").onclick = showStart;
$("hsBtn").onclick = () => openBoard("overall");
$("seeAll").onclick = () => openBoard(topic);
$("hsClose").onclick = closeBoard;
$("hsModal").onclick = e => { if (e.target === $("hsModal")) closeBoard(); };
$("hsTabs").onclick = e => { const b = e.target.closest(".hs-tab"); if (b) { boardTab = b.dataset.board; renderBoard(); } };
$("soundBtn").onclick = () => { setSound(!soundOn); if (soundOn) playSound(true); };

document.addEventListener("keydown", e => {
  if (!$("hsModal").hidden) { if (e.key === "Escape") closeBoard(); return; }
  if (e.target.closest(".versions, .topicbar, .subjects, form, input, textarea")) return;
  if ($("play").hidden || answered) return;
  const n = parseInt(e.key, 10);
  if (n >= 1 && n <= 4 && quiz[i].type === "mcq") choose(quiz[i].opts[n - 1]);
  else if (e.key.toLowerCase() === "h") showHint();
});

const sv = +store.get("fatsQuizVersion");
version = sv >= 1 && sv <= 5 ? sv : 1;
const st = store.get("nutritionQuizTopic"), ss = store.get("quizSubject");
if (SUBJECTS[ss]) setSubject(ss);
else if (TOPICS[st]) setSubject(subjectOf(st), st);
else setSubject("foodtech");
setSound(soundOn);
showStart();
loadScores().then(updateCta);
</script>
