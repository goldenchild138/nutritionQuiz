<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nutrition Revision Quiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600;700;800&display=swap">
<style>
[hidden] { display: none !important }
body { margin: 0 }
/* Layout: topic select, title + test switcher, then one question card; answers 2x2, stacking on phones */
:root {
  --bg: #f3f5ee; --surface: #ffffff; --fg: #1d2418; --muted: #5d6656;
  --accent: #c98a00; --accent-ink: #1d2418; --accent-soft: #fbf0d4; --line: #d9dfd0;
  --good: #2f7d3b; --good-bg: #e2f2e2; --bad: #b3362b; --bad-bg: #f8e1de;
  --display: "Barlow", system-ui, -apple-system, sans-serif;
  --body: "Barlow", system-ui, -apple-system, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #151a12; --surface: #1f261b; --fg: #edf0e6; --muted: #a3ad98;
  --accent: #f0b52a; --accent-ink: #151a12; --accent-soft: #3a3016; --line: #34402e;
  --good: #7fd18b; --good-bg: #1f3a22; --bad: #f08a7e; --bad-bg: #3d1f1b; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #151a12; --surface: #1f261b; --fg: #edf0e6; --muted: #a3ad98;
  --accent: #f0b52a; --accent-ink: #151a12; --accent-soft: #3a3016; --line: #34402e;
  --good: #7fd18b; --good-bg: #1f3a22; --bad: #f08a7e; --bad-bg: #3d1f1b; color-scheme: dark }

* { box-sizing: border-box }
body { background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 17px; line-height: 1.5 }
.wrap { max-width: 720px; margin: 0 auto; padding-inline: 16px; padding-block: 32px 48px; display: grid; gap: 20px }
h1, h2 { font-family: var(--display); text-wrap: balance; margin: 0 }
.eyebrow { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 700 }
.topicbar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px }
.topicbar label { margin: 0 }
.hs-cta { margin-left: auto; font: inherit; display: inline-flex; align-items: center; gap: 10px; padding: 8px 16px 8px 12px; border-radius: 12px; border: 2px solid var(--fg); background: var(--accent); color: var(--accent-ink); cursor: pointer; box-shadow: 3px 3px 0 var(--fg); text-align: left }
.hs-cta:hover { transform: translate(-1px, -1px); box-shadow: 4px 4px 0 var(--fg) }
.hs-cta:focus-visible, .linkbtn:focus-visible, .hs-tab:focus-visible, .name-input:focus-visible { outline: 3px solid var(--fg); outline-offset: 2px }
.hs-cta span { display: grid; line-height: 1.2 }
.hs-cta small { font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums }
.player { margin: 0; color: var(--muted) }
.sound { font: inherit; font-size: 14px; font-weight: 700; padding: 8px 12px; border-radius: 999px; border: 2px solid var(--line); background: var(--surface); color: var(--fg); cursor: pointer }
.sound[aria-pressed="false"] { color: var(--muted); text-decoration: line-through }
.sound:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px }
.linkbtn { font: inherit; font-weight: 700; background: none; border: 0; padding: 0; color: var(--fg); cursor: pointer; text-decoration: underline; text-decoration-color: var(--accent); text-decoration-thickness: 2px; text-underline-offset: 3px }
.name-input { font: inherit; font-size: 18px; padding: 12px 14px; border-radius: 10px; border: 2px solid var(--line); background: var(--bg); color: var(--fg); flex: 1 1 220px; min-width: 0 }
.err { margin: 0; color: var(--bad); font-weight: 700 }
.board-mini { display: grid; gap: 10px; padding: 16px; border-radius: 12px; background: var(--bg); border: 1px solid var(--line) }
.rankline { margin: 0; font-weight: 700 }
.savenote { margin: 0; font-size: 14px; color: var(--muted) }
.table-wrap { overflow-x: auto }
.board { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums }
.board th { text-align: left; font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); padding: 6px 8px; border-bottom: 2px solid var(--line); white-space: nowrap }
.board td { padding: 8px; border-bottom: 1px solid var(--line); white-space: nowrap }
.board td.name { white-space: normal; font-weight: 700; min-width: 8ch }
.board td.big { font-family: var(--display); font-weight: 800; font-size: 18px }
.board tr.me td { background: var(--accent-soft) }
.board .medal { display: inline-grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; font-weight: 800; font-size: 13px; background: var(--line); color: var(--fg) }
.board tr:nth-child(1) .medal { background: #e8b923; color: #1d2418 } .board tr:nth-child(2) .medal { background: #c4cbd3; color: #1d2418 } .board tr:nth-child(3) .medal { background: #cd8a4b; color: #1d2418 }
.board .empty { color: var(--muted); padding: 16px 8px; white-space: normal }
.overlay { position: fixed; inset: 0; background: rgb(0 0 0 / .45); display: grid; place-items: start center; padding: max(24px, env(safe-area-inset-top, 0px)) 16px 24px; overflow-y: auto; z-index: 10 }
.sheet { width: 100%; max-width: 720px; background: var(--surface); color: var(--fg); border-radius: 16px; border: 2px solid var(--fg); padding: 20px; display: grid; gap: 14px; box-shadow: 6px 6px 0 var(--fg) }
.hs-tabs { display: flex; flex-wrap: wrap; gap: 6px }
.hs-tab { font: inherit; font-weight: 700; font-size: 14px; padding: 6px 14px; border-radius: 999px; border: 2px solid var(--line); background: transparent; color: var(--fg); cursor: pointer }
.hs-tab[aria-selected="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg) }
.select { font: inherit; font-weight: 700; font-size: 16px; padding: 10px 40px 10px 14px; border-radius: 10px; border: 2px solid var(--line); background-color: var(--surface); color: var(--fg); cursor: pointer; appearance: none; -webkit-appearance: none;
  background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%);
  background-position: calc(100% - 20px) 55%, calc(100% - 15px) 55%; background-size: 5px 5px; background-repeat: no-repeat; max-width: 100% }
.select:hover { border-color: var(--accent) }
.select:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px }
.head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: end; gap: 16px }
.versions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap }
.versions .eyebrow { margin-right: 4px }
.v { font-family: var(--display); font-weight: 800; font-size: 18px; width: 44px; height: 44px; border-radius: 10px; border: 2px solid var(--line); background: var(--surface); color: var(--fg); cursor: pointer }
.v:hover { border-color: var(--accent) }
.v[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink) }
.v:focus-visible, .opt:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 24px; display: grid; gap: 20px }
.progress { display: flex; gap: 3px }
.progress span { height: 6px; flex: 1; border-radius: 3px; background: var(--line) }
.progress span.ok { background: var(--good) } .progress span.no { background: var(--bad) } .progress span.now { background: var(--accent) }
.meta { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap }
.meta b { font-variant-numeric: tabular-nums }
.q { font-size: clamp(22px, 4vw, 30px); line-height: 1.2; font-weight: 800 }
.opts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px }
@media (max-width: 520px) { .opts { grid-template-columns: 1fr } }
.opt { font: inherit; text-align: left; padding: 14px 16px; border-radius: 10px; border: 2px solid var(--line); background: var(--bg); color: var(--fg); cursor: pointer; display: flex; gap: 12px; align-items: baseline; min-width: 0 }
.opt:hover:not(:disabled) { border-color: var(--accent) }
.opt:disabled { cursor: default }
.opt kbd { font-family: var(--display); font-weight: 800; color: var(--muted); font-size: 14px }
.opt.correct { border-color: var(--good); background: var(--good-bg) }
.opt.wrong { border-color: var(--bad); background: var(--bad-bg) }
.opt .tick { margin-left: auto; font-style: normal; font-weight: 800; font-size: 22px; line-height: 1; align-self: center }
.opt.correct .tick { color: var(--good) }
.opt .buddy { width: 48px; height: 48px; margin-block: -10px; flex: none; margin-left: auto; align-self: center; image-rendering: pixelated; animation: hop .5s ease-out, bob .52s ease-in-out .5s infinite alternate }
@keyframes bob { from { transform: translateY(0) } to { transform: translateY(-3px) } }
.opt .buddy + .tick { margin-left: 0 }
@keyframes hop { 0% { transform: translateY(8px) scale(.4); opacity: 0 } 60% { transform: translateY(-6px) scale(1.1); opacity: 1 } 100% { transform: none } }
@media (prefers-reduced-motion: reduce) { .opt .buddy { animation: none } }
.remember { font: inherit; font-weight: 700; justify-self: start; background: none; border: 0; padding: 4px 0; color: var(--fg); cursor: pointer; display: inline-flex; gap: 8px; align-items: center; text-decoration: underline; text-decoration-color: var(--accent); text-decoration-thickness: 2px; text-underline-offset: 4px }
.remember::before { content: "▸"; color: var(--accent); transition: transform .2s; text-decoration: none }
.remember[aria-expanded="true"]::before { transform: rotate(90deg) }
.remember:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px }
.memory { border: 2px dashed var(--accent); background: var(--accent-soft); border-radius: 14px; padding: 20px; display: grid; gap: 14px; animation: pop .25s ease-out }
@keyframes pop { from { transform: translateY(-6px); opacity: 0 } to { transform: none; opacity: 1 } }
.mem-visual { display: flex; flex-wrap: wrap; gap: 8px }
.mem-visual span { font-family: var(--display); font-weight: 800; font-size: clamp(18px, 3.4vw, 24px); line-height: 1.15; padding: 8px 14px; border-radius: 10px; background: var(--surface); border: 2px solid var(--fg); box-shadow: 3px 3px 0 var(--fg) }
.mem-trick { margin: 0; font-size: 18px }
.mem-points { margin: 0; padding-left: 20px; display: grid; gap: 4px; color: var(--muted) }
@media (prefers-reduced-motion: reduce) { .memory { animation: none } }
.total { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap }
.total .pct { font-family: var(--display); font-size: 28px; font-weight: 700; color: var(--muted); font-variant-numeric: tabular-nums }
.opt.wrong .tick { color: var(--bad) }
.hint { background: var(--accent-soft); border-radius: 10px; padding: 12px 16px; margin: 0 }
.hint strong { font-family: var(--display) }
.feedback { border-left: 4px solid var(--accent); padding: 4px 0 4px 14px; color: var(--muted); margin: 0 }
.feedback strong { color: var(--fg) }
.btn { font: inherit; font-weight: 700; padding: 12px 22px; border-radius: 999px; border: 0; background: var(--accent); color: var(--accent-ink); cursor: pointer }
.btn.ghost { background: transparent; color: var(--fg); border: 2px solid var(--line) }
.btn.ghost:hover:not(:disabled) { border-color: var(--accent) }
.btn:disabled { opacity: .45; cursor: default }
.btn:focus-visible { outline: 3px solid var(--fg); outline-offset: 2px }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center }
.score { font-family: var(--display); font-size: 64px; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums }
.review { list-style: none; padding: 0; margin: 0; display: grid }
.review li { display: grid; grid-template-columns: 28px 1fr; gap: 8px; padding-block: 10px; border-top: 1px solid var(--line) }
.review .mark { font-weight: 800; font-variant-numeric: tabular-nums } .review .ok { color: var(--good) } .review .no { color: var(--bad) }
.review small { color: var(--muted); display: block }

</style>
</head>
<body>

<main class="wrap">
  <div class="topicbar">
    <label class="eyebrow" for="topic">Topic</label>
    <select class="select" id="topic">
      <option value="carbs">Carbohydrates</option>
      <option value="protein">Protein</option>
      <option value="fats">Fats</option>
      <option value="pastry">Pastry</option>
    </select>
    <button class="sound" id="soundBtn" aria-pressed="true">Sound on</button>
    <button class="hs-cta" id="hsBtn" aria-haspopup="dialog">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M7 3h10v2h4v3a5 5 0 0 1-4.6 5A5 5 0 0 1 13 16.9V19h3v2H8v-2h3v-2.1A5 5 0 0 1 7.6 13 5 5 0 0 1 3 8V5h4V3Zm0 4H5v1a3 3 0 0 0 2 2.8V7Zm10 0v3.8A3 3 0 0 0 19 8V7h-2Z"/></svg>
      <span><b>High scores</b><small id="hsTop">Loading…</small></span>
    </button>
  </div>

  <div class="head">
    <div style="display:grid;gap:6px">
      <span class="eyebrow" id="kicker">Food &amp; nutrition</span>
      <h1 id="title">Fats Quiz</h1>
      <p class="player" id="playerLine" hidden>Playing as <b id="playerName"></b> · <button class="linkbtn" id="changeName">Change name</button></p>
    </div>
    <div class="versions" role="group" aria-label="Test">
      <span class="eyebrow">Test</span>
      <button class="v" id="v1" data-v="1">1</button>
      <button class="v" id="v2" data-v="2">2</button>
      <button class="v" id="v3" data-v="3">3</button>
      <button class="v" id="v4" data-v="4">4</button>
      <button class="v" id="v5" data-v="5">5</button>
    </div>
  </div>


  <!-- NAME -->
  <form class="card start" id="start">
    <span class="eyebrow">Before you start</span>
    <h2 class="q" style="margin:0">What's your name?</h2>
    <p style="margin:0;color:var(--muted)">Your best scores go on the high score board for this topic and the overall board for all four topics.</p>
    <div class="row">
      <input class="name-input" id="nameInput" maxlength="20" autocomplete="nickname" placeholder="e.g. Sam K" aria-label="Your name" required>
      <button class="btn" type="submit">Start quiz</button>
    </div>
    <p class="err" id="nameErr" hidden></p>
  </form>

  <!-- QUIZ -->
  <section class="card" id="play" hidden>
    <div class="progress" id="progress"></div>
    <div class="meta"><span class="eyebrow" id="qnum"></span><span class="eyebrow">Score <b id="running">0</b></span></div>
    <h2 class="q" id="qtext"></h2>
    <div class="opts" id="opts"></div>
    <p class="hint" id="hintBox" hidden></p>
    <p class="feedback" id="feedback" hidden></p>
    <div class="row">
      <button class="btn ghost" id="hintBtn">Show hint</button>
      <button class="btn" id="next" hidden>Next question</button>
    </div>
    <button class="remember" id="rememberBtn" aria-expanded="false" aria-controls="memory" hidden>Help me remember this</button>
    <div class="memory" id="memory" hidden>
      <span class="eyebrow">Memory card · <span id="memTitle"></span></span>
      <div class="mem-visual" id="memVisual"></div>
      <p class="mem-trick"><strong>Trick:</strong> <span id="memTrick"></span></p>
      <ul class="mem-points" id="memPoints"></ul>
    </div>
  </section>

  <section class="card" id="done" hidden>
    <span class="eyebrow" id="doneLabel">Your score</span>
    <div class="total"><div class="score" id="score"></div><span class="pct" id="pct"></span></div>
    <p id="verdict" style="margin:0"></p>
    <div class="row">
      <button class="btn" id="again">Retry this test</button>
      <button class="btn ghost" id="nextVersion">Try the next test</button>
    </div>
    <div class="board-mini">
      <div class="meta"><span class="eyebrow" id="miniTitle">High scores</span><button class="linkbtn" id="seeAll">See all high scores</button></div>
      <p class="rankline" id="rankLine"></p>
      <div class="table-wrap"><table class="board" id="miniBoard"></table></div>
      <p class="savenote" id="saveStatus"></p>
    </div>
    <ul class="review" id="review"></ul>
  </section>

</main>

<!-- HIGH SCORES -->
<div class="overlay" id="hsModal" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="hsTitle">
    <div class="meta" style="align-items:center">
      <h2 id="hsTitle" style="font-size:28px">High scores</h2>
      <button class="btn ghost" id="hsClose">Close</button>
    </div>
    <div class="hs-tabs" role="tablist" aria-label="Board">
      <button class="hs-tab" role="tab" data-board="overall">Overall</button>
      <button class="hs-tab" role="tab" data-board="carbs">Carbohydrates</button>
      <button class="hs-tab" role="tab" data-board="protein">Protein</button>
      <button class="hs-tab" role="tab" data-board="fats">Fats</button>
      <button class="hs-tab" role="tab" data-board="pastry">Pastry</button>
    </div>
    <p class="savenote" id="hsNote"></p>
    <div class="table-wrap"><table class="board" id="hsTable"></table></div>
  </div>
</div>

<script>
const PER_QUIZ = 20;
// Each entry: [question, correct answer, [wrong answers], explanation, hint]
const TOPICS = {
carbs: { name: "Carbohydrates", bank: [
  ["Carbohydrates are a…", "Macronutrient", ["Micronutrient", "Mineral", "Vitamin"], "Carbohydrates are a macronutrient, needed in large amounts.", "The body needs them in large amounts."],
  ["Which elements make up carbohydrates?", "Carbon, hydrogen and oxygen", ["Carbon, hydrogen and nitrogen", "Calcium, hydrogen and oxygen", "Nitrogen, oxygen and iron"], "Carbohydrates are made of hydrogen, carbon and oxygen (H + C + O).", "Think C-H-O."],
  ["Plants make carbohydrates during…", "Photosynthesis", ["Respiration", "Fermentation", "Digestion"], "Carbohydrates are made by plants during photosynthesis.", "Plants use sunlight to make their food."],
  ["What is the main function of carbohydrates?", "The body's main source of energy", ["Growth and repair", "Insulating the body", "Carrying vitamins A, D, E and K"], "Carbohydrates are the body's main source of energy.", "Think fuel."],
  ["Besides energy, starchy carbohydrates also provide…", "B vitamins, iron, calcium and fibre", ["Only vitamin C", "Only water", "Omega-3 fatty acids"], "Starchy carbohydrates also provide protein, calcium, iron, B vitamins and dietary fibre.", "Think of the nutrients in wholemeal bread."],
  ["The body breaks carbohydrate down into…", "Glucose", ["Amino acids", "Fatty acids", "Glycerol"], "Carbohydrate is digested into glucose, which cells use for energy.", "A simple sugar that cells use for energy."],
  ["Glucose is absorbed into the blood through the…", "Small intestine", ["Large intestine", "Stomach", "Mouth"], "Glucose is absorbed through the small intestine into the blood.", "The long, narrow part of the gut."],
  ["Which organ makes insulin?", "Pancreas", ["Liver", "Kidneys", "Heart"], "The pancreas makes insulin.", "An organ that sits behind the stomach."],
  ["What does insulin do?", "Helps glucose enter cells", ["Breaks down fat", "Builds muscle protein", "Stores calcium in bones"], "Insulin helps glucose enter cells, which then release energy from it.", "It acts like a key that unlocks cells."],
  ["Simple carbohydrates are…", "Sugars", ["Starches", "Proteins", "Fats"], "Simple carbohydrates are sugars.", "Think sweet."],
  ["Complex carbohydrates are…", "Starches", ["Sugars", "Amino acids", "Fats"], "Complex carbohydrates are starches.", "Think bread, rice and potatoes."],
  ["How are simple carbohydrates digested?", "Quickly, giving energy fast", ["Slowly, giving steady energy", "They are not digested", "Only in the stomach"], "Simple carbohydrates are digested quickly and give energy fast.", "Simple structure, short job for the body."],
  ["How do complex carbohydrates release energy?", "Slowly and steadily", ["All at once", "Not at all", "Only at night"], "Complex carbohydrates are digested more slowly and release energy more steadily.", "Bigger molecules take longer to break down."],
  ["Complex carbohydrates are…", "Polysaccharides", ["Monosaccharides", "Disaccharides", "Triglycerides"], "Starches are polysaccharides: many sugar units joined together.", "'Poly' means many."],
  ["The word 'saccharide' comes from the Latin word for…", "Sugar", ["Starch", "Energy", "Bread"], "A saccharide is a unit of carbohydrate. The word comes from the Latin for sugar.", "Think of a sweet artificial sweetener called saccharin."],
  ["Which is a monosaccharide?", "Glucose", ["Sucrose", "Starch", "Lactose"], "Monosaccharides are the most basic sugars, e.g. glucose and fructose.", "The sugar our cells use for energy."],
  ["Fructose is a…", "Monosaccharide", ["Disaccharide", "Polysaccharide", "Protein"], "Fructose is a monosaccharide, like glucose.", "'Mono' means one."],
  ["A disaccharide is made of…", "Two monosaccharides", ["One monosaccharide", "Many polysaccharides", "Two amino acids"], "Disaccharides are made of two monosaccharides joined together.", "'Di' means two."],
  ["Sucrose is made of…", "Glucose and fructose", ["Two glucose units", "Starch and fibre", "Glucose and protein"], "Sucrose is a disaccharide made of glucose and fructose.", "Two monosaccharides named on the slides."],
  ["Which is a complex carbohydrate?", "Starch", ["Glucose", "Fructose", "Sucrose"], "Starch is a polysaccharide, so it's a complex carbohydrate.", "The only option that isn't a sugar."],
  ["What is the Glycaemic Index (GI)?", "A ranking of carbohydrate foods by how quickly they affect blood sugar", ["A list of foods high in protein", "A measure of fat content", "The number of calories in a food"], "GI ranks carbohydrate foods by how quickly they affect blood sugar levels.", "It's about blood sugar."],
  ["High GI foods are digested ___ and cause a ___ rise in blood sugar.", "Quickly, sharp", ["Slowly, gentle", "Quickly, gentle", "Slowly, sharp"], "High GI foods are digested quickly and cause a sharp rise in blood sugar.", "High GI means fast."],
  ["Low GI foods are digested ___ and cause a ___ rise in blood sugar.", "Slowly, gentle", ["Quickly, sharp", "Quickly, gentle", "Slowly, sharp"], "Low GI foods are digested slowly and cause a gentle rise in blood sugar.", "Low GI means slow."],
  ["Which is a high GI food?", "White bread", ["Wholemeal bread", "Brown rice", "Peach"], "White bread, pasta, pineapple and melon are high GI.", "The refined, less fibrous option."],
  ["Which is a low GI food?", "Brown rice", ["White bread", "Pineapple", "Melon"], "Wholemeal bread, brown rice and peach are low GI.", "The wholegrain option."],
  ["Which fruit is low GI?", "Peach", ["Melon", "Pineapple", "Both melon and pineapple"], "Peach is listed as low GI. Melon and pineapple are high GI.", "A stone fruit with a fuzzy skin."],
  ["Most of our energy should come from…", "Starchy foods and natural sugars", ["Sugary drinks and sweets", "Fats and oils", "Protein shakes"], "Most energy should come from starchy food and natural sugars, e.g. bread, pasta, fruit and vegetables.", "Bread, pasta, fruit and vegetables."],
  ["Extra carbohydrate the body doesn't use is converted into…", "Fat, which can lead to obesity", ["Protein", "Vitamins", "Water"], "Excess carbohydrate is converted into fat, which can lead to obesity.", "The body stores spare energy for later."],
  ["Eating too much sugary food can lead to…", "Dental caries (tooth decay)", ["Rickets", "Scurvy", "Night blindness"], "Too much sugar can lead to dental caries.", "Think about your teeth."],

// Seeded random so each test always has the same questions; questions run in slide order
function rng(seed) { return () => { seed = (seed + 0x6D2B79F5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t ^= t + Math.imul(t ^ (t >>> 7), 61 | t); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
function shuffle(a, r = Math.random) { a = a.slice(); for (let k = a.length - 1; k > 0; k--) { const j = Math.floor(r() * (k + 1)); [a[k], a[j]] = [a[j], a[k]]; } return a; }
function seedFor(s) { let h = 0; for (const ch of s) h = (h * 31 + ch.charCodeAt(0)) | 0; return h; }

// Each test gets its own share of questions (up to 10) found in no other test, topped up to 20 from the rest
function buildVersions(key, bank) {
  const s = seedFor(key), uniq = Math.min(10, Math.floor(bank.length / 5));
  const base = shuffle(bank.map(b => b.id), rng(s + 2026));
  return [0, 1, 2, 3, 4].map(v => {
    const own = base.slice(v * uniq, v * uniq + uniq);
    const rest = shuffle(base.filter(n => !own.includes(n)), rng(s + 100 + v)).slice(0, PER_QUIZ - own.length);
    const r = rng(s + 500 + v);
    return [...own, ...rest].sort((x, y) => x - y).map(n => ({ ...bank[n], opts: shuffle([bank[n].a, ...bank[n].w], r) }));
  });
}

        body: JSON.stringify({ fields: { name: { stringValue: rec.name }, topic: { stringValue: rec.topic }, test: { integerValue: String(rec.test) },
          score: { integerValue: String(rec.score) }, hints: { integerValue: String(rec.hints) }, createdAt: { timestampValue: rec.at } } }) });
      if (!res.ok) throw new Error(res.status);
      return "online";
    } catch (e) { saveLocal(rec); return "offline"; }
  }
  saveLocal(rec); return "device";
}

// Best attempt per person: higher score, then fewer hints, then earlier
const better = (a, b) => a.score !== b.score ? a.score > b.score : a.hints !== b.hints ? a.hints < b.hints : a.at < b.at;
function topicBoard(key) {
  const best = new Map(), tries = new Map();
  allScores.filter(s => s.topic === key).forEach(s => {
    const k = nameKey(s.name); tries.set(k, (tries.get(k) || 0) + 1);
    if (!best.has(k) || better(s, best.get(k))) best.set(k, s);
  });
  return [...best.entries()].map(([k, s]) => ({ ...s, key: k, tries: tries.get(k) }))
    .sort((a, b) => b.score - a.score || a.hints - b.hints || (a.at < b.at ? -1 : 1));
}
function overallBoard() {
  const people = new Map();
  for (const key of Object.keys(TOPICS)) topicBoard(key).forEach(s => {
    const p = people.get(s.key) || { key: s.key, name: s.name, total: 0, done: 0, by: {} };
    p.by[key] = s.score; p.total += s.score; p.done++; people.set(s.key, p);
  });
  return [...people.values()].sort((a, b) => b.total - a.total || b.done - a.done || a.name.localeCompare(b.name));
}

const medal = n => `<span class="medal">${n}</span>`;
function fillTable(table, head, rows, empty) {
  table.innerHTML = "";
  const thead = table.createTHead().insertRow();
  head.forEach(h => { const th = document.createElement("th"); th.textContent = h; thead.appendChild(th); });
  const body = table.createTBody();
  if (!rows.length) { const td = body.insertRow().insertCell(); td.colSpan = head.length; td.className = "empty"; td.textContent = empty; return; }
  rows.forEach(r => {
    const tr = body.insertRow(); if (r.me) tr.className = "me";
    r.cells.forEach(([val, cls, html]) => { const td = tr.insertCell(); if (cls) td.className = cls; html ? td.innerHTML = val : td.textContent = val; });
  });
}
const me = k => player && k === nameKey(player);
function topicRows(key, limit) {
  return topicBoard(key).slice(0, limit).map((s, n) => ({ me: me(s.key), cells: [[medal(n + 1), "", true], [s.name, "name"], [`${s.score}/20`, "big"], [`Test ${s.test}`], [s.hints ? `${s.hints}` : "–"], [String(s.tries)]] }));
}
const TOPIC_HEAD = ["#", "Name", "Best", "Test", "Hints", "Tries"];
function sourceNote() {
  return scoresFrom === "online" ? "Live class board: everyone's best scores." :
    scoresFrom === "offline" ? "Couldn't reach the class board, so these are scores saved on this device." :
    "Scores saved on this device. Set up the class board to share scores between devices.";
}

function renderBoard() {
  document.querySelectorAll(".hs-tab").forEach(b => b.setAttribute("aria-selected", String(b.dataset.board === boardTab)));
  $("hsNote").textContent = sourceNote();
  if (boardTab === "overall") {
    const keys = Object.keys(TOPICS);
    const SHORT = { carbs: "Carbs", protein: "Protein", fats: "Fats", pastry: "Pastry" };
    fillTable($("hsTable"), ["#", "Name", "Total /80", ...keys.map(k => SHORT[k])],
      overallBoard().slice(0, 50).map((p, n) => ({ me: me(p.key), cells: [[medal(n + 1), "", true], [p.name, "name"], [String(p.total), "big"], ...keys.map(k => [p.by[k] ?? "–"])] })),
      "No scores yet. Finish a test to get on the board.");
  } else fillTable($("hsTable"), TOPIC_HEAD, topicRows(boardTab, 50), `No ${TOPICS[boardTab].name.toLowerCase()} scores yet.`);
}
async function openBoard(tab) {
  boardTab = tab || "overall";
  $("hsModal").hidden = false; renderBoard(); $("hsClose").focus();
  await loadScores(); renderBoard(); updateCta();
}
function closeBoard() { $("hsModal").hidden = true; $("hsBtn").focus(); }
function updateCta() {
  const top = topicBoard(topic)[0];
  $("hsTop").textContent = top ? `${TOPICS[topic].name}: ${top.name} ${top.score}/20` : `${TOPICS[topic].name}: no scores yet`;
}
async function postResult(n, hints) {
  const rec = { name: player, topic, test: version, score: n, hints, at: new Date().toISOString() };
  $("miniTitle").textContent = `High scores · ${TOPICS[topic].name}`;
  $("rankLine").textContent = "Saving your score…"; $("saveStatus").textContent = "";
  const where = await saveScore(rec);
  await loadScores();
  const board = topicBoard(topic), pos = board.findIndex(s => s.key === nameKey(player)) + 1, best = board[pos - 1];
  const o = overallBoard(), opos = o.findIndex(p => p.key === nameKey(player)) + 1;
  $("rankLine").textContent = pos ? `${player}, you're #${pos} of ${board.length} on ${TOPICS[topic].name}` +
    (best && best.score > n ? ` (your best is ${best.score}/20)` : "") + (opos ? ` and #${opos} overall.` : ".") : "";
  fillTable($("miniBoard"), TOPIC_HEAD, topicRows(topic, 5), "No scores yet.");
  $("saveStatus").textContent = where === "online" ? "Your score was added to the class board." :
    where === "offline" ? "Couldn't reach the class board. Your score was saved on this device instead." : "Your score was saved on this device.";
  updateCta();
}

/* ---------- player name ---------- */
function showStart() {
  started = false;
  $("start").hidden = false; $("play").hidden = true; $("done").hidden = true; $("playerLine").hidden = true;
  $("nameInput").value = player; $("nameErr").hidden = true;
  $("nameInput").focus({ preventScroll: true });
}
function beginAs(name) {
  const clean = name.trim().replace(/\s+/g, " ");
  if (clean.length < 2) { $("nameErr").textContent = "Enter at least 2 letters so you can find yourself on the board."; $("nameErr").hidden = false; return; }
  player = clean; store.set("nutritionQuizPlayer", player); started = true;
  $("playerName").textContent = player; $("playerLine").hidden = false; $("start").hidden = true;
  startQuiz();
}

/* ---------- sounds (made in the browser, no files) ---------- */
let audio, soundOn = store.get("nutritionQuizSound") !== "off";
function tone(freq, start, dur, type = "sine", vol = .18, slideTo) {
  audio = audio || new (window.AudioContext || window.webkitAudioContext)();
  const t = audio.currentTime + start, o = audio.createOscillator(), g = audio.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + .015); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(audio.destination); o.start(t); o.stop(t + dur + .05);
}
function playSound(ok) {
  if (!soundOn) return;
  try {
    if (ok) { tone(988, 0, .12, "triangle"); tone(1319, .09, .35, "triangle"); tone(2637, .09, .25, "sine", .05); }   // bright two-note ping
    else { tone(196, 0, .18, "square", .07, 150); tone(147, .16, .3, "square", .07, 110); }                          // low "uh-oh" buzz
  } catch (e) {}
}
function setSound(on) {
  soundOn = on; store.set("nutritionQuizSound", on ? "on" : "off");
  $("soundBtn").setAttribute("aria-pressed", String(on));
  $("soundBtn").textContent = on ? "Sound on" : "Sound off";
}

/* ---------- topic + test ---------- */
function setTopic(key) {
  topic = key; store.set("nutritionQuizTopic", key);
  const t = TOPICS[key];
  $("topic").value = key;
  $("title").textContent = `${t.name} Quiz`;
  $("kicker").textContent = `Food & nutrition · ${t.bank.length} questions`;
  VERSIONS = buildVersions(key, t.bank);
  setVersion(version);
  updateCta();
}
function setVersion(v) {
  version = v; store.set("fatsQuizVersion", v);
  document.querySelectorAll(".v").forEach(b => b.setAttribute("aria-pressed", String(+b.dataset.v === v)));
  startQuiz();
}

/* ---------- quiz ---------- */
function startQuiz() {
  quiz = VERSIONS[version - 1]; i = 0; results = [];
  $("progress").innerHTML = quiz.map(() => "<span></span>").join("");
  $("done").hidden = true; $("play").hidden = !started;
  show();
}
function show() {
  const item = quiz[i]; answered = false; hintUsed = false;
  $("qnum").textContent = `Test ${version} · Question ${i + 1} of ${quiz.length}`;
  $("running").textContent = results.filter(r => r.ok).length;
  $("qtext").textContent = item.q;
  $("opts").innerHTML = "";
  item.opts.forEach((txt, n) => {
    const b = document.createElement("button");
    b.className = "opt"; b.id = "opt" + n;
    b.innerHTML = `<kbd>${n + 1}</kbd><span></span>`;
    b.querySelector("span").textContent = txt;
    b.onclick = () => choose(txt);
    $("opts").appendChild(b);
  });
  $("hintBox").hidden = true; $("hintBtn").hidden = false; $("hintBtn").disabled = false;
  $("feedback").hidden = true; $("next").hidden = true;
  $("rememberBtn").hidden = true; $("memory").hidden = true; $("rememberBtn").setAttribute("aria-expanded", "false");
  $("progress").children[i].className = "now";
}
function showHint() {
  if (answered) return;
  hintUsed = true;
  $("hintBox").innerHTML = "<strong>Hint:</strong> ";
  $("hintBox").append(quiz[i].hint);
  $("hintBox").hidden = false; $("hintBtn").disabled = true;
}
function choose(txt) {
  if (answered) return; answered = true;
  const item = quiz[i], ok = txt === item.a;
  results.push({ item, txt, ok, hint: hintUsed });
  playSound(ok);
  [...$("opts").children].forEach(b => {
    b.disabled = true;
    const t = b.querySelector("span").textContent;
    const mark = (cls, sym, label) => { b.classList.add(cls); b.insertAdjacentHTML("beforeend", `<i class="tick" aria-label="${label}">${sym}</i>`); };
    if (t === item.a) { mark("correct", "✓", "Correct answer"); if (ok) b.insertBefore(pixelBuddy(), b.querySelector(".tick")); }
    else if (t === txt) mark("wrong", "✗", "Wrong answer");
  });
  $("progress").children[i].className = ok ? "ok" : "no";
  $("running").textContent = results.filter(r => r.ok).length;
  $("feedback").innerHTML = "<strong></strong> ";
  $("feedback").firstChild.textContent = ok ? "Correct." : `Not quite. The answer is ${item.a}.`;
  $("feedback").append(item.why);
  $("feedback").hidden = false; $("hintBtn").hidden = true;
  $("next").textContent = i === quiz.length - 1 ? "See my score" : "Next question";
  $("next").hidden = false; $("next").focus({ preventScroll: true });
  const mem = memoryFor(topic, item.id);
  if (mem) {
    $("memTitle").textContent = mem.title;
    $("memVisual").innerHTML = "";
    mem.visual.forEach(v => { const s = document.createElement("span"); s.textContent = v; $("memVisual").appendChild(s); });
    $("memTrick").textContent = mem.mnemonic;
    $("memPoints").innerHTML = "";
    mem.points.forEach(p => { const li = document.createElement("li"); li.textContent = p; $("memPoints").appendChild(li); });
    $("rememberBtn").hidden = false;
  }
}
function toggleMemory() {
  const open = $("memory").hidden;
  $("memory").hidden = !open;
  $("rememberBtn").setAttribute("aria-expanded", String(open));
}
// A random, symmetric 8x8 pixel character that walks, waves and blinks
function pixelBuddy() {
  const N = 8, cv = document.createElement("canvas");
  cv.width = cv.height = N; cv.className = "buddy"; cv.setAttribute("aria-hidden", "true");
  const g = cv.getContext("2d"), hue = Math.floor(Math.random() * 360);
  const body = `hsl(${hue} 80% 45%)`, shade = `hsl(${hue} 80% 28%)`;
  // Random body (rows 1-5, columns 1-3), mirrored so it looks like a creature
  const cells = [];
  for (let y = 1; y <= 5; y++) for (let x = 1; x < N / 2; x++) if (Math.random() < 0.6) cells.push([x, y]);
  cells.push([2, 5], [3, 5], [3, 1]);             // always a solid torso and a head top, so it never looks like scattered dots
  const px = (x, y) => { g.fillRect(x, y, 1, 1); g.fillRect(N - 1 - x, y, 1, 1); };

  function draw(f, blink) {
    g.clearRect(0, 0, N, N);
    g.fillStyle = body;
    cells.forEach(([x, y]) => px(x, y));
    g.fillRect(2, 2, 4, 3);                       // head, so it always has a face
    px(0, f ? 2 : 4);                             // arms: up on one frame, down on the other
    g.fillStyle = shade;
    if (f) { px(2, 6); px(1, 7); } else { px(3, 6); px(3, 7); }  // legs: apart, then together
    if (!blink) {
      g.fillStyle = "#fff"; px(2, 3);
      g.fillStyle = "#111"; g.fillRect(2, 3, 1, .5); g.fillRect(5, 3, 1, .5);
    }
  }

  let f = 0, tick = 0;
  draw(0, false);
  if (!matchMedia("(prefers-reduced-motion: reduce)").matches) {
    const id = setInterval(() => {
      if (tick > 2 && !cv.isConnected) return clearInterval(id);  // stop once the question changes
      tick++; f ^= 1;
      draw(f, tick % 12 === 0);                   // blink every few seconds
    }, 260);
  }
  return cv;
}

function next() { i++; i < quiz.length ? show() : finish(); }
function finish() {
  $("play").hidden = true; $("done").hidden = false;
  const n = results.filter(r => r.ok).length, total = quiz.length, hints = results.filter(r => r.hint).length;
  $("doneLabel").textContent = `${TOPICS[topic].name} · Test ${version} · Total score`;
  $("score").textContent = `${n}/${total}`;
  $("pct").textContent = `${Math.round(n / total * 100)}% · ${n} right, ${total - n} wrong`;
  const v = n === total ? `Perfect score. You know your ${TOPICS[topic].name.toLowerCase()}.` : n >= 15 ? "Strong work. Check the ones you missed below." : n >= 10 ? "A good start. Revise the missed questions and try again." : "Look back over the slides, use the hints, then have another go.";
  $("verdict").textContent = v + (hints ? ` You used ${hints} hint${hints > 1 ? "s" : ""}.` : "");
  $("nextVersion").textContent = `Try test ${version % 5 + 1}`;
  $("review").innerHTML = "";
  results.forEach((r, k) => {
    const li = document.createElement("li");
    li.innerHTML = `<span class="mark ${r.ok ? "ok" : "no"}">${k + 1}</span><div><span></span><small></small></div>`;
    li.querySelector("div span").textContent = r.item.q;
    li.querySelector("small").textContent = (r.ok ? `✓ ${r.item.a}` : `✗ Answer: ${r.item.a} (you said ${r.txt})`) + (r.hint ? " · hint used" : "");
    $("review").appendChild(li);
  });
  postResult(n, hints);
}


/* ---------- wiring ---------- */
$("topic").onchange = e => setTopic(e.target.value);
document.querySelectorAll(".v").forEach(b => b.onclick = () => setVersion(+b.dataset.v));
$("hintBtn").onclick = showHint;
$("rememberBtn").onclick = toggleMemory;
$("next").onclick = next;
$("again").onclick = () => startQuiz();
$("nextVersion").onclick = () => setVersion(version % 5 + 1);
$("start").onsubmit = e => { e.preventDefault(); beginAs($("nameInput").value); };
$("changeName").onclick = showStart;
$("hsBtn").onclick = () => openBoard("overall");
$("seeAll").onclick = () => openBoard(topic);
$("hsClose").onclick = closeBoard;
$("hsModal").onclick = e => { if (e.target === $("hsModal")) closeBoard(); };
document.querySelectorAll(".hs-tab").forEach(b => b.onclick = () => { boardTab = b.dataset.board; renderBoard(); });
$("soundBtn").onclick = () => { setSound(!soundOn); if (soundOn) playSound(true); };

document.addEventListener("keydown", e => {
  if (!$("hsModal").hidden) { if (e.key === "Escape") closeBoard(); return; }
  if (e.target.closest(".versions, .topicbar, form")) return;
  if ($("play").hidden || answered) return;
  const n = parseInt(e.key, 10);
  if (n >= 1 && n <= 4) choose(quiz[i].opts[n - 1]);
  else if (e.key.toLowerCase() === "h") showHint();
});

const sv = +store.get("fatsQuizVersion");
version = sv >= 1 && sv <= 5 ? sv : 1;
const st = store.get("nutritionQuizTopic");
setTopic(TOPICS[st] ? st : "fats");
setSound(soundOn);
showStart();
loadScores().then(updateCta);
</script>
</body>
